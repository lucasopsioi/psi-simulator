<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSD PSI 推演 · Salesboard</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1c1e21; --sub:#6b7280; --Garnet:#e5e7eb;
  --accent:#c7000b; --accent-soft:#fdeced;
  --hist:#f8f9fb; --ov:#fff3d6; --ov-ink:#8a5a00; --fill:#eef4ff; --fill-ink:#2b5bb7;
  --warn:#d92f2f; --warn-soft:#fde8e8; --amber:#b45309; --amber-soft:#fef3c7;
  --ok:#0e7a3d; --ok-soft:#e5f5ec; --chip:#eef0f3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141619; --card:#1e2126; --ink:#e8eaed; --sub:#9aa2ad; --Garnet:#33383f;
    --accent:#ff4d55; --accent-soft:#3a1518; --hist:#23262b; --ov:#3d3010; --ov-ink:#f2c14e;
    --fill:#1b2940; --fill-ink:#8ab0f5; --warn:#ff6b6b; --warn-soft:#3a1a1a;
    --amber:#f0b35c; --amber-soft:#3a2c10; --ok:#4cc47e; --ok-soft:#12301e; --chip:#2a2e34; }
}
:root[data-theme="dark"]{ --bg:#141619; --card:#1e2126; --ink:#e8eaed; --sub:#9aa2ad; --Garnet:#33383f;
  --accent:#ff4d55; --accent-soft:#3a1518; --hist:#23262b; --ov:#3d3010; --ov-ink:#f2c14e;
  --fill:#1b2940; --fill-ink:#8ab0f5; --warn:#ff6b6b; --warn-soft:#3a1a1a;
  --amber:#f0b35c; --amber-soft:#3a2c10; --ok:#4cc47e; --ok-soft:#12301e; --chip:#2a2e34; }
.pv2Ext{background:var(--fill);color:var(--fill-ink)}
td[data-carry]{text-decoration:underline dotted;text-underline-offset:3px}
.pv2mx{cursor:pointer;opacity:.5;font-weight:700;padding:0 3px;user-select:none;display:inline-block}
.pv2mx:hover{opacity:1}
#pvXp{position:fixed;z-index:98;display:none;background:var(--card);border:1px solid var(--Garnet);border-radius:10px;
  padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:12.5px;Garnet-height:1.5;overflow:auto;max-height:70vh}
#pvXp table td{border:1px solid var(--Garnet);padding:3px 8px}
/* 推演编辑矩阵:冻结表头与左两列 */
#view-pv thead th{position:sticky;top:0;z-index:6;background:var(--card)}
#view-pv thead tr:first-child th:nth-child(1){position:sticky;left:0;z-index:9}
#view-pv thead tr:first-child th:nth-child(2){position:sticky;z-index:9}
#view-pv tbody td[data-ci="0"]{position:sticky;left:0;z-index:4;background:var(--card)}
#view-pv tbody td[data-ci="1"]{position:sticky;z-index:4;background:var(--card)}
main th{position:relative}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--Garnet);padding:0 16px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0 0}
h1{font-size:17px;margin:0;font-weight:700}
h1 .sub{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px}
#dataline{color:var(--sub);font-size:12px;margin-left:auto}
nav{display:flex;gap:2px;margin-top:8px}
nav button{border:0;background:none;color:var(--sub);padding:8px 14px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav .badge{background:var(--warn);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px}
.chip.lockc{background:var(--fill);color:var(--fill-ink)}
.chip.gapc{background:var(--warn-soft);color:var(--warn)}
.chip.manc{background:var(--ov);color:var(--ov-ink)}
.mkIn{width:76px;background:var(--bg);color:var(--ink);border:1px solid var(--Garnet);border-radius:6px;padding:3px 6px;font-size:12px}
.mkCtry{border:1px solid var(--Garnet);border-radius:8px;padding:8px 10px;margin-top:8px}
.mkBar{display:inline-block;height:8px;background:var(--accent);border-radius:3px;vertical-align:middle;opacity:.75}
main td.xsel{box-shadow:inset 0 0 0 99px rgba(199,0,11,.12);outline:1px solid var(--accent)}
#xgBar{position:fixed;right:16px;bottom:14px;z-index:96;display:flex;gap:8px;align-items:center;
  background:var(--card);border:1px solid var(--Garnet);border-radius:10px;padding:8px 12px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px}
#xgBar b{color:var(--accent)}
#xgBar input{width:110px;background:var(--bg);color:var(--ink);border:1px solid var(--Garnet);border-radius:6px;padding:4px 8px;font-size:12px}
#xgBar button{background:var(--bg);color:var(--ink);border:1px solid var(--Garnet);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
#xgBar button:hover{border-color:var(--accent);color:var(--accent)}
#xgBar .xgsep{width:1px;height:18px;background:var(--Garnet)}
#xgFlash{position:fixed;right:16px;bottom:64px;z-index:97;background:var(--card);border:1px solid var(--accent);
  color:var(--ink);border-radius:8px;padding:6px 12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .18s}
#xgFlash.on{opacity:1}
#aiDock{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;z-index:95;display:flex;flex-direction:column;
  background:var(--card);border-left:1px solid var(--Garnet);box-shadow:-8px 0 30px rgba(0,0,0,.15)}
#aiHead{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--Garnet)}
#aiMsgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#aiFoot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--Garnet)}
#aiIn{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--Garnet);border-radius:8px;padding:6px 10px;font-size:13px;resize:none;font-family:inherit}
.aiMsg{max-width:100%;border-radius:10px;padding:8px 12px;font-size:13px;Garnet-height:1.55;word-break:break-word}
.aiMsg.aiU{background:var(--fill);color:var(--fill-ink);align-self:flex-end;max-width:88%}
.aiMsg.aiA{background:var(--hist);border:1px solid var(--Garnet)}
.aiMsg table{border-collapse:collapse;font-size:12px}
.aiMsg table td{border:1px solid var(--Garnet);padding:3px 8px}
.aiMsg code{background:var(--bg);border-radius:4px;padding:0 4px}
nav button.aiNav{color:var(--accent);font-weight:600}
main{padding:14px 16px 60px;max-width:100%}
section{display:none}
section.on{display:block}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.kpi .v{font-size:20px;font-weight:700}
.kpi .t{font-size:12px;color:var(--sub)}
.kpi.warn .v{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--Garnet);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--card);color:var(--ink);border:1px solid var(--Garnet);border-radius:6px;padding:5px 8px;font:inherit}
input[type=number]{width:80px}
button.act{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 14px;font:inherit;cursor:pointer}
button.act:hover{filter:brightness(1.08)}
button.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--Garnet);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}
.tblwrap{overflow:auto;border:1px solid var(--Garnet);border-radius:8px;background:var(--card);max-height:72vh}
table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--Garnet);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--card);z-index:5;font-weight:600;color:var(--sub)}
th.l,td.l{text-align:left}
tbody tr:hover td{background:var(--accent-soft)}
td.ell{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px}
.chip.auto{background:var(--ok-soft);color:var(--ok)}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.anchor{background:var(--fill);color:var(--fill-ink)}
.chip.base{background:var(--amber-soft);color:var(--amber)}
.chip.skip{background:var(--chip);color:var(--sub)}
.chip.audio{background:var(--accent-soft);color:var(--accent)}
.dosLow{color:var(--warn);font-weight:700}
.dosMid{color:var(--amber);font-weight:600}
td.oct,th.oct{background:var(--accent-soft)}
td.pvCell{cursor:cell;user-select:none}
td.pvSel{box-shadow:inset 0 0 0 2px var(--accent)!important;background:var(--accent-soft)!important}
.muted{color:var(--sub)}
/* 推演网格 */
.grid th.wk{min-width:58px;text-align:center;font-weight:500}
.grid th.wk .d{font-size:10px;color:var(--sub);font-weight:400}
.grid td.hist{background:var(--hist)}
.grid th.futStart,.grid td.futStart{border-left:2px solid var(--accent)}
.grid td.met,.grid th.met{position:sticky;left:0;background:var(--card);z-index:6;text-align:left;font-weight:600;min-width:120px;border-right:1px solid var(--Garnet)}
.grid td[contenteditable]{background:var(--card);outline:none;cursor:text}
.grid td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.grid td.ov{background:var(--ov)!important;color:var(--ov-ink);font-weight:700}
.grid td.fill{background:var(--fill)!important;color:var(--fill-ink)}
.grid td.norep{color:var(--sub);font-style:italic}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--Garnet)}
.confirmCard{border:1px solid var(--Garnet);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:10px;background:var(--card)}
.confirmCard h4{margin:0 0 4px;font-size:14px}
.confirmCard .why{color:var(--sub);font-size:12px;margin-bottom:8px}
.confirmCard .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirmCard .ctl .grp{display:flex;gap:6px;align-items:center;background:var(--chip);border-radius:8px;padding:5px 8px}
.msWrap{position:relative;display:inline-block}
.msPop{display:none;position:absolute;top:110%;left:0;z-index:60;background:var(--card);border:1px solid var(--Garnet);border-radius:8px;padding:8px;max-height:320px;overflow:auto;min-width:240px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.msOpt{display:block;padding:3px 4px;font-size:13px;cursor:pointer;white-space:nowrap}
.msOpt:hover{background:var(--chip);border-radius:4px}
button.mini{background:var(--chip);color:var(--ink);border:1px solid var(--Garnet);border-radius:5px;padding:1px 8px;font-size:11px;cursor:pointer}
textarea#paste{width:100%;min-height:180px;font:12px/1.4 Consolas,monospace}
#report{font-size:13px;white-space:pre-wrap;color:var(--sub)}
.note{font-size:12px;color:var(--sub)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--Garnet);color:var(--sub);font-size:11px;padding:3px 16px;z-index:20}
.metaRow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px}
.metaRow b{font-size:15px}
.ver{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;vertical-align:2px}
#expOv{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
.expCard{background:var(--card);border:1px solid var(--Garnet);border-radius:12px;max-width:min(1320px,96vw);width:100%;max-height:92vh;overflow:auto;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.expHead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.expHead>.ghost{margin-left:auto}
.thSort{cursor:pointer;user-select:none;white-space:nowrap}

#bootOv{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}
.bootCard{width:min(430px,82vw);background:var(--card);border:1px solid var(--Garnet);border-radius:12px;padding:26px 30px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.bootBrand{font-size:18px;font-weight:700;margin-bottom:16px}
.bootBrand::after{content:"Salesboard";display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px}
.bootTrack{height:8px;border-radius:99px;background:var(--Garnet);overflow:hidden}

.bootRow{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12px;color:var(--sub)}
#bootPct{font-variant-numeric:tabular-nums;color:var(--ink);flex:none}
#bootTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>

<script>
/*CORE-START*/
(function(){
'use strict';
const C={};
const DAY=86400000;

/* ---------- 数值 ---------- */
C.parseCellNum=function(v){
  const t=String(v==null?'':v).replace(/[,\s　￥$]/g,'');
  if(t===''||t==='-'||t==='—') return null;
  const n=parseFloat(t);
  return isFinite(n)?n:null;
};
C.round5=function(v,step){ step=step||5; if(v==null||!isFinite(v)) return null; return Math.round(v/step)*step; };
/* 累计取整(2026-09-01 用户拍板):每周值仍是 step 的倍数,但累计和跟住原始累计——周销 2 台的长尾 SKU 出 0/5/0/5 而不是全 0,总量不丢;
   手拍(override)原样保留且不参与进位;step≤1 退化为普通四舍五入 */
C.quantizeSeq=function(vals,step){
  step=step||5;
  if(step<=1)return vals.map(function(v){ return Math.max(0,Math.round(v||0)); });
  let cumRaw=0,cumOut=0;
  return vals.map(function(v){ cumRaw+=Math.max(0,v||0); const tgt=Math.round(cumRaw/step)*step; const out=Math.max(0,tgt-cumOut); cumOut+=out; return out; });
};
/* 拍数承接(2026-09-01 用户拍板:某月 SO 从 200 拍到 500,后面不能还按 200 的基数算):
   手拍周的 拍值÷公式值 作为比例,承接到其后各周(直到下一次拍数),夹在 0.2~5 倍;手拍周本身原样保留。数组带 carryEnd 供延伸段接力 */
C.carryTaps=function(futureWeeks,rawOf,ovSO,on){
  const out=[]; let carry=1;
  futureWeeks.forEach(function(p,i){
    const ov=ovSO&&ovSO[p];
    const r=rawOf(p,i);
    if(ov!=null){
      if(on!==false&&r.so!=null&&r.so>0)carry=Math.max(0.2,Math.min(5,ov/r.so));
      out.push({p:p,so:ov,src:'override'}); return;
    }
    if(r.so==null){ out.push({p:p,so:null,src:r.src}); return; }
    const e={p:p,so:r.so*carry,src:r.src}; if(carry!==1)e.carry=+carry.toFixed(3);
    out.push(e);
  });
  out.carryEnd=carry;
  return out;
};
/* 正常经营水位(2026-09-01 用户拍板:每个渠道×产品要有"能吃进多少货/平销库存水位/平销DOS"的判断):
   取平销引擎保留的平销周(已剔首销/大促/缺货/清尾),库存中位=平销库存水位,库存÷平销日均 的中位=平销DOS;≥6 周有库存记录才成立 */
C.normalLevelOf=function(u,bl){
  if(!bl||bl.base==null||!(bl.base>0)||!bl.usedPeriods||!bl.usedPeriods.length)return null;
  const daily=bl.base/7, invs=[];
  bl.usedPeriods.forEach(function(p){ const w=u.weeks.get(p); if(!w)return;
    const iv=w.inv!=null?w.inv:w.inv1; if(iv!=null&&iv>=0)invs.push(iv); });
  if(invs.length<6)return null;
  const inv=C.medianOf(invs);
  return {inv:Math.round(inv),dos:Math.round(inv/daily),n:invs.length};
};
C.quantizeFc=function(fc,step){
  const idx=[],raw=[];
  fc.forEach(function(f,i){ if(f.src==='override'||f.so==null)return; idx.push(i); raw.push(f.so); });
  const q=C.quantizeSeq(raw,step);
  idx.forEach(function(i,k){ fc[i].so=q[k]; });
  return fc;
};
C.fmt=function(v){ return v==null?'—':Number(v).toLocaleString('en-US'); };

/* 字节→文本：BOM 优先(UTF-16LE/BE/UTF-8),再试 UTF-8,乱码多退 GB18030;
   无 BOM 的 UTF-16LE(Excel「Unicode文本」)靠 NUL 字节占比识别 */
C.decodeSmart=function(u8){
  if(!(u8 instanceof Uint8Array)) u8=new Uint8Array(u8);
  if(u8.length>=2){
    if(u8[0]===0xFF&&u8[1]===0xFE) return new TextDecoder('utf-16le').decode(u8).replace(/^\ufeff/,'');
    if(u8[0]===0xFE&&u8[1]===0xFF) return new TextDecoder('utf-16be').decode(u8).replace(/^\ufeff/,'');
  }
  /* 无 BOM UTF-16 必须在 GB18030 回退之前判——UTF-16 字节喂给 GB18030 会解出
     一串不报错的假文字;而 UTF-8/GB18030 文本不含 NUL 字节,该判据零误伤 */
  let nul=0; const n=Math.min(u8.length,4096);
  for(let i=0;i<n;i++) if(u8[i]===0)nul++;
  if(n>0&&nul/n>0.2){ try{ return new TextDecoder('utf-16le').decode(u8).replace(/^\ufeff/,''); }catch(e){} }
  let txt=new TextDecoder('utf-8',{fatal:false}).decode(u8);
  const bad=(txt.match(/�/g)||[]).length;
  if(bad>2){ try{ txt=new TextDecoder('gb18030').decode(u8); }catch(e){} }
  return txt.replace(/^\ufeff/,'');
};

/* ---------- ISO 周 ---------- */
C.mondayOf=function(y,w){ const jan4=Date.UTC(y,0,4); const dow=new Date(jan4).getUTCDay()||7; return new Date(jan4-(dow-1)*DAY+(w-1)*7*DAY); };
C.isoWeekOf=function(dt){ const d=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate())); const dow=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dow); const y=d.getUTCFullYear(); const w=Math.ceil(((d-Date.UTC(y,0,1))/DAY+1)/7); return {y:y,w:w}; };
C.weeksInISOYear=function(y){ return C.isoWeekOf(new Date(Date.UTC(y,11,28))).w; };
C.mkPeriod=function(y,w){ return y*1000+w; };
C.periodOfDateStr=function(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return null;
  const iw=C.isoWeekOf(new Date(Date.UTC(+m[1],+m[2]-1,+m[3]))); return C.mkPeriod(iw.y,iw.w); };
C.periodY=function(p){ return Math.floor(p/1000); };
C.periodW=function(p){ return p%1000; };
C.addWeeksP=function(p,n){ let y=C.periodY(p),w=C.periodW(p);
  while(n>0){ w++; if(w>C.weeksInISOYear(y)){y++;w=1;} n--; }
  while(n<0){ w--; if(w<1){y--;w=C.weeksInISOYear(y);} n++; }
  return C.mkPeriod(y,w); };
const wIdxMemo={};
C.weekIndex=function(p){ const y=C.periodY(p); let base=wIdxMemo[y];
  if(base==null){ base=0; for(let yy=2000;yy<y;yy++) base+=C.weeksInISOYear(yy); wIdxMemo[y]=base; }
  return base+C.periodW(p); };
C.weekLabel=function(p){ return 'W'+C.periodW(p); };
C.weekRangeLabel=function(p){ const m=C.mondayOf(C.periodY(p),C.periodW(p)); const e=new Date(m.getTime()+6*DAY);
  const f=function(d){ return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); }; return f(m)+'-'+f(e); };

/* ---------- 底表解析 ---------- */
C.parseTable=function(text){
  const rep={total:0,used:0,badPeriod:0,badPsi:0,noKey:0,header:false,mode:''};
  const raw=String(text||'').replace(/\r/g,'');
  const lines=raw.split('\n').filter(function(l){return l.trim()!=='';});
  if(!lines.length) return {rows:[],report:rep};
  const probe=lines[0];
  const nOf=function(re){ return (probe.match(re)||[]).length; };
  let mode,delim=',';
  if(nOf(/\t/g)>0)mode='tsv';
  else if(nOf(/\|/g)>=2)mode='md';
  else { mode='csv'; if(nOf(/;/g)>nOf(/,/g))delim=';'; }   // 分号 CSV(部分区域设置导出)
  rep.mode=mode+(delim===';'?';':'');
  const splitLine=function(l){
    if(mode==='tsv') return l.split('\t');
    if(mode==='md'){ let cells=l.split('|');
      if(cells.length&&cells[0].trim()==='')cells.shift();
      if(cells.length&&cells[cells.length-1].trim()==='')cells.pop();
      return cells.map(function(c){return c.trim();}); }
    const out=[]; let cur='',q=false;
    for(let i=0;i<l.length;i++){ const ch=l[i];
      if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"')q=true; else if(ch===delim){out.push(cur);cur='';} else cur+=ch; } }
    out.push(cur); return out;
  };
  const grid=lines.map(splitLine).filter(function(cells){
    if(mode!=='md') return true;
    return !cells.every(function(c){ return /^:?-{2,}:?$/.test(c)||c===''; });
  });
  const r=C.parseGrid(grid);
  r.report.mode=rep.mode;
  return r;
};

/* 网格(二维数组,单元格可为数字/字符串)→ 标准行。xlsx sheet 与文本粘贴共用同一条链 */
C.parseGrid=function(grid){
  const rep={total:0,used:0,badPeriod:0,badPsi:0,noKey:0,header:false,mode:'grid'};
  if(!grid||!grid.length) return {rows:[],report:rep};
  const norm=function(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9一-鿿]/g,''); };
  const KEY=[
    ['Drift',['countr','国家','地区']],
    ['account',['account','channel','客户','账户','渠道']],
    ['Garnet',['productline','产品线','品类']],
    ['model',['productmodel','model','型号']],
    ['series',['productseries','series','系列']],
    ['product',['product','产品']],
    ['period',['period','期间','周期']],
    ['psi',['psitype','psi','类型']],
    ['qty',['qty','quantity','数量']]
  ];
  const colMap={}; let hits=0;
  grid[0].map(norm).forEach(function(cell,idx){
    for(let k=0;k<KEY.length;k++){ const field=KEY[k][0],pats=KEY[k][1];
      if(colMap[field]!=null) continue;
      let hit=false;
      for(let j=0;j<pats.length;j++){ if(cell.indexOf(pats[j])>=0){hit=true;break;} }
      if(hit){ colMap[field]=idx; hits++; return; }
    }
  });
  let start=0;
  if(hits>=3){ rep.header=true; start=1; }
  else { Object.keys(colMap).forEach(function(k){delete colMap[k];});
    const order=(grid[0].length>=9)
      ?['Drift','account','Garnet','product','series','model','period','psi','qty']   // 下游表 9 列
      :['Drift','account','Garnet','product','model','period','psi','qty'];           // FSD 表 8 列
    order.forEach(function(f,i){ colMap[f]=i; }); }
  const psiNorm=function(s){ const t=norm(s); if(!t) return null;
    if(t.indexOf('inventory1')>=0||t.indexOf('库存1')>=0||t==='inv1') return 'inv1';
    if(t.indexOf('inventory')>=0||t.indexOf('库存')>=0||t==='inv') return 'inv';
    if(t.indexOf('sellin')>=0||t==='si') return 'si';
    if(t.indexOf('purchase')>=0||t.indexOf('进货')>=0) return 'si';   // 下游表 Purchase = 该渠道的进货
    if(t.indexOf('sellout')>=0||t==='so') return 'so';
    if(t.indexOf('sellthrough')>=0||t==='st') return 'st';
    if(t.indexOf('dos')>=0) return 'dos';                              // DOS1 也归到 dos
    return null; };
  const parsePeriod=function(v){
    const t=String(v==null?'':v).trim();
    const mw=t.match(/^(\d{4})\s*[wW]\s*(\d{1,3})$/);   // 下游表格式 2026W01
    let y,w;
    if(mw){ y=+mw[1]; w=+mw[2]; }
    else { const s=t.replace(/\D/g,'');
      if(s.length!==6&&s.length!==7) return null;
      y=+s.slice(0,4); w=+s.slice(4); }
    if(y<2000||y>2100||w<1||w>53) return null;
    return C.mkPeriod(y,w); };
  const rows=[];
  for(let i=start;i<grid.length;i++){
    const g=grid[i];
    if(!g||g.length===0||g.every(function(c){ return c==null||c===''; })) continue;
    rep.total++;
    const cell=function(f){ return colMap[f]!=null?g[colMap[f]]:undefined; };
    const period=parsePeriod(cell('period'));
    if(period==null){ rep.badPeriod++; continue; }
    const psi=psiNorm(cell('psi'));
    if(!psi){ rep.badPsi++; continue; }
    const model=String(cell('model')||'').trim();
    const account=String(cell('account')||'').trim();
    if(!model||!account){ rep.noKey++; continue; }
    rows.push({ Drift:String(cell('Drift')||'').trim(), account:account,
      Garnet:String(cell('Garnet')||'').trim(), product:String(cell('product')||'').trim(),
      series:String(cell('series')||'').trim(),
      model:model, period:period, psi:psi, qty:C.parseCellNum(cell('qty')) });
    rep.used++;
  }
  return {rows:rows,report:rep};
};

C.buildStore=function(rows,opts){
  const retail=!!(opts&&opts.retail);
  const units=new Map(); let maxPeriod=0,minPeriod=Infinity;
  rows.forEach(function(r){
    /* key 含国家:同一账户可在多个国家开展业务(如神州数码同时做巴西与加拿大),必须分开 */
    const k=(r.Drift||'')+C.SEP+r.account+C.SEP+r.model;
    let u=units.get(k);
    if(!u){ u={key:k,Drift:r.Drift,account:r.account,Garnet:r.Garnet,product:r.product,model:r.model,
      series:r.series||'',rawNames:{},unmapped:!!r.unmapped,audio:false,weeks:new Map()}; units.set(k,u); }
    if(r.Garnet&&!u.Garnet)u.Garnet=r.Garnet;
    if(r.product&&!u.product)u.product=r.product;
    if(r.Drift&&!u.Drift)u.Drift=r.Drift;
    if(r.series&&!u.series)u.series=r.series;
    if(r.rawAccount)u.rawNames[r.rawAccount]=1;
    let w=u.weeks.get(r.period);
    if(!w){ w={si:null,so:null,inv:null,inv1:null,dos:null,st:null}; u.weeks.set(r.period,w); }
    const fld=(retail&&r.psi==='inv1')?'inv':r.psi;   // 下游表的 Inventory1 = 该渠道的库存本体
    if(r.qty!=null) w[fld]=(w[fld]==null?0:w[fld])+r.qty;
    if(r.period>maxPeriod)maxPeriod=r.period;
    if(r.period<minPeriod)minPeriod=r.period;
  });
  units.forEach(function(u){ u.audio=C.isAudioLine(u.Garnet);
    u.rawNames=Object.keys(u.rawNames);
    u.periods=Array.from(u.weeks.keys()).sort(function(a,b){return a-b;}); });
  return {units:units,maxPeriod:maxPeriod,minPeriod:isFinite(minPeriod)?minPeriod:0,retail:retail};
};

/* 就地把下游行的渠道名换成简称。优先级:用户别名 > 内置映射 > 原名(打未映射标)。
   Others 不合并:显示为 Others(原名),保留可读性。幂等:重复应用以 rawAccount 起算(改名重放用)。 */
C.applyChannelMap=function(rows,alias){
  let unmapped=0; const unmappedNames={};
  rows.forEach(function(r){
    const raw=r.rawAccount||r.account;
    r.rawAccount=raw;
    const custom=alias&&alias[String(raw==null?'':raw).trim()];
    if(custom){ r.account=custom; r.unmapped=false; return; }
    const mapped=C.mapChannel(raw);
    if(mapped){ r.account=(mapped==='Others')?('Others('+raw+')'):mapped; r.unmapped=false; }
    else { r.account=raw; r.unmapped=true; unmapped++; unmappedNames[raw]=1; }
  });
  return {unmapped:unmapped,names:Object.keys(unmappedNames)};
};

/* 多文件合并：同一 账户×型号×周×指标 在多个文件出现时，修改时间新的文件覆盖旧的；
   同一文件内的重复行相加（与替换粒度同层级去重，教训见 knowledge/desktop-app-upgrade-and-archive）。 */
C.mergeFiles=function(files){
  const list=files.slice().sort(function(a,b){ return (a.mtimeMs||0)-(b.mtimeMs||0); });
  const map=new Map(); const perFile=[];
  list.forEach(function(f){
    const local=new Map();
    (f.rows||[]).forEach(function(r){
      const k=(r.Drift||'')+C.SEP+r.account+C.SEP+r.model+C.SEP+r.period+C.SEP+r.psi;
      const ex=local.get(k);
      if(ex){ if(r.qty!=null) ex.qty=(ex.qty==null?0:ex.qty)+r.qty;
        if(!ex.Garnet&&r.Garnet)ex.Garnet=r.Garnet; if(!ex.product&&r.product)ex.product=r.product; }
      else local.set(k,{Drift:r.Drift,account:r.account,Garnet:r.Garnet,product:r.product,
        series:r.series||'',model:r.model,period:r.period,psi:r.psi,qty:r.qty});
    });
    let overridden=0;
    local.forEach(function(v,k){ if(map.has(k))overridden++; map.set(k,v); });
    perFile.push({name:f.name,kept:local.size,overridden:overridden});
  });
  return {rows:Array.from(map.values()),perFile:perFile};
};

C.unitCurrent=function(u,cfg){
  const win=(cfg&&cfg.dosWindow)||4;
  let curInv=null,curInvP=0,curInv1=null,curInv1P=0,sysDos=null,sysDosP=0;
  u.periods.forEach(function(p){ const w=u.weeks.get(p);
    if(w.inv!=null&&p>=curInvP){curInv=w.inv;curInvP=p;}
    if(w.inv1!=null&&p>=curInv1P){curInv1=w.inv1;curInv1P=p;}
    if(w.dos!=null&&p>=sysDosP){sysDos=w.dos;sysDosP=p;}
  });
  const soWeeks=u.periods.filter(function(p){ const so=u.weeks.get(p).so;
    return u.audio ? (so!=null&&so>0) : (so!=null); });
  const wnd=soWeeks.slice(-win);
  let sum=0; wnd.forEach(function(p){ sum+=u.weeks.get(p).so; });
  const avgW=wnd.length?sum/wnd.length:null;
  const daily=avgW!=null?avgW/7:null;
  const dosCalc=(curInv!=null&&daily>0)?Math.round(curInv/daily):null;
  const lastSOP=soWeeks.length?soWeeks[soWeeks.length-1]:null;
  return {curInv:curInv,curInvP:curInvP,curInv1:curInv1,curInv1P:curInv1P,
    sysDos:sysDos,sysDosP:sysDosP,avgWeeklySO:avgW,dailySO:daily,dosCalc:dosCalc,
    lastSOP:lastSOP,lastSO:lastSOP!=null?u.weeks.get(lastSOP).so:null,windowWeeks:wnd};
};

C.classify=function(u,refYear,futureWeeks,cfg){
  const minH=(cfg&&cfg.minHistWeeks)||8, minCov=(cfg&&cfg.minRefCov)||0.6;
  /* 纯库存管控单元:从无任何 SO 记录(整列缺失,不是 0)——典型为「只含 Inventory1 的直签渠道库存表」。
     只参与 库存/ST 管控,不做 SO 推演、不进待确认。注意与音频跳零区分:音频是有 SO 记录但 0=未报量。 */
  let hasSO=false;
  u.periods.forEach(function(p){ if(u.weeks.get(p).so!=null)hasSO=true; });
  if(!hasSO)return {status:'stock',histWeeks:0,refCov:0,missing:futureWeeks.length};
  let histWeeks=0;
  u.periods.forEach(function(p){ if(C.periodY(p)===refYear){ const so=u.weeks.get(p).so; if(so!=null&&so>0)histWeeks++; } });
  let cov=0;
  futureWeeks.forEach(function(p){ const rp=C.refPeriodOf(p,refYear); const w=u.weeks.get(rp);
    if(w&&w.so!=null&&w.so>0)cov++; });
  const refCov=futureWeeks.length?cov/futureWeeks.length:0;
  let status;
  if(histWeeks===0)status='new';
  else if(histWeeks>=minH&&refCov>=minCov)status='auto';
  else status='partial';
  return {status:status,histWeeks:histWeeks,refCov:refCov,missing:futureWeeks.length-cov};
};

/* ---------- 周系数分层（默认=去年周销占比指数,均值≈1）----------
   三层：产品线 / 国家×产品线 / 产品线×产品；≥8个有数周才成层。
   取用时选最细可用层；用户微调挂在层实例键上（L|线、C|国家|线、P|线|产品）。 */
C.seasonIndexLayers=function(store,refYear){
  const Garnet=new Map(), cl=new Map(), al=new Map(), lp=new Map(), cp=new Map(), glob=new Map();
  const cpPar={};   // 渠道×产品 → 其父层 渠道×产品线 键
  const add=function(m,k,w,so){ let x=m.get(k); if(!x){x=new Map();m.set(k,x);} x.set(w,(x.get(w)||0)+so); };
  store.units.forEach(function(u){
    u.periods.forEach(function(p){ if(C.periodY(p)!==refYear)return;
      const so=u.weeks.get(p).so; if(so==null||so<=0)return;
      const w=C.periodW(p);
      add(Garnet,u.Garnet,w,so);
      add(cl,u.Drift+'|'+u.Garnet,w,so);
      add(al,u.account+'|'+u.Garnet,w,so);
      add(lp,u.Garnet+'|'+u.product,w,so);
      add(cp,u.account+'|'+u.product,w,so); cpPar[u.account+'|'+u.product]=u.account+'|'+u.Garnet;
      glob.set(w,(glob.get(w)||0)+so);
    });
  });
  const toIdx=function(m){ const ws=Array.from(m.keys()); if(ws.length<8)return null;
    let s=0; ws.forEach(function(w){s+=m.get(w);}); const mean=s/ws.length; const out={};
    ws.forEach(function(w){ out[w]=+(m.get(w)/mean).toFixed(2); }); return out; };
  const conv=function(m){ const o={}; m.forEach(function(v,k){ const i=toIdx(v); if(i)o[k]=i; }); return o; };
  const alIdx=conv(al);
  /* 渠道×产品(2026-09-01 用户拍板:每个产品在不同渠道各有自己的 SO 节奏,回测出来指引次年):
     ≥16 有数周才成层;单品周销抖动大,做 3 周平滑并与父层(渠道×产品线)各半收缩,既保留该品自己的大促时点又不放大噪声 */
  const smooth=function(idx){ const ws=Object.keys(idx).map(Number).sort(function(a,b){return a-b;}); const o={};
    ws.forEach(function(w,i){ const a=i>0?idx[ws[i-1]]:idx[w], b=i<ws.length-1?idx[ws[i+1]]:idx[w];
      o[w]=+((a+idx[w]+b)/3).toFixed(2); }); return o; };
  const convCP=function(m){ const o={}; m.forEach(function(v,k){
    if(v.size<16)return;
    const raw=toIdx(v); if(!raw)return;
    const sm=smooth(raw), par=alIdx[cpPar[k]]||null, out={};
    Object.keys(sm).forEach(function(w){ const pv=(par&&par[w]!=null)?par[w]:sm[w]; out[w]=+((sm[w]*0.5+pv*0.5)).toFixed(2); });
    o[k]=out; }); return o; };
  return { Garnet:conv(Garnet), DriftLine:conv(cl), acctLine:alIdx, GarnetProduct:conv(lp), acctProduct:convCP(cp), global:toIdx(glob)||{} };
};
/* 为单元选最细可用层（layersArr 按优先顺序,如 [下游层,FSD层]）。
   优先级:渠道×产品 > 渠道×产品线 > 国家×产品线 > 产品线×产品 > 产品线 > 全局
   （大促节奏是渠道属性,渠道层最优先——用户 2026-08-25 拍板;2026-09-01 再下沉到渠道×产品） */
C.pickKLayer=function(layersArr,u){
  const tryGet=function(field,k){ for(let i=0;i<layersArr.length;i++){ const L=layersArr[i];
    if(L&&L[field]&&L[field][k])return L[field][k]; } return null; };
  let m=tryGet('acctProduct',u.account+'|'+u.product);
  if(m)return {key:'CP|'+u.account+'|'+u.product,kdef:m,label:'渠道×产品'};
  m=tryGet('acctLine',u.account+'|'+u.Garnet);
  if(m)return {key:'A|'+u.account+'|'+u.Garnet,kdef:m,label:'渠道×产品线'};
  m=tryGet('DriftLine',u.Drift+'|'+u.Garnet);
  if(m)return {key:'C|'+u.Drift+'|'+u.Garnet,kdef:m,label:'国家×产品线'};
  m=tryGet('GarnetProduct',u.Garnet+'|'+u.product);
  if(m)return {key:'P|'+u.Garnet+'|'+u.product,kdef:m,label:'产品线×产品'};
  m=tryGet('Garnet',u.Garnet);
  if(m)return {key:'L|'+u.Garnet,kdef:m,label:'产品线'};
  for(let i=0;i<layersArr.length;i++){ const L=layersArr[i];
    if(L&&L.global&&Object.keys(L.global).length)return {key:'L|'+u.Garnet,kdef:L.global,label:'全局'}; }
  return {key:'L|'+u.Garnet,kdef:{},label:'无历史(=1)'};
};

/* ---------- 补货规律学习：每个 渠道×产品 从自己历史学「触发DOS→补到DOS」 ----------
   扫历史周(计算口径的滚动DOS,音频跳零):凡 SI>0 且 SI≥2周均销 视为一次补货事件,
   记事件前一周 DOS(触发) 与事件当周补后 DOS(目标),各取中位数。样本≥3 才算学到。
   线上渠道可能是 30→60 而非 90→120——所以按单元学,学不到才用产品线默认参数。 */
C.learnReplenish=function(u,cfg){
  const win=(cfg&&cfg.dosWindow)||4;
  const trig=[],targ=[];
  const q=[];
  let prevDos=null;
  u.periods.forEach(function(p){
    const wk=u.weeks.get(p);
    const so=wk.so;
    const soValid=u.audio?(so!=null&&so>0):(so!=null);
    if(soValid){ q.push(so); while(q.length>win)q.shift(); }
    let s=0; q.forEach(function(v){s+=v;});
    const daily=q.length?s/q.length/7:0;
    const dos=(wk.inv!=null&&daily>0)?wk.inv/daily:null;
    const avgW=q.length?s/q.length:0;
    if(wk.si!=null&&wk.si>0&&avgW>0&&wk.si>=avgW*2&&prevDos!=null&&dos!=null){
      trig.push(prevDos); targ.push(dos);
    }
    if(dos!=null)prevDos=dos;
  });
  if(trig.length<3)return null;
  const med=function(a){ const b=a.slice().sort(function(x,y){return x-y;}); return b[Math.floor(b.length/2)]; };
  const clamp=function(v){ return Math.max(7,Math.min(400,Math.round(v))); };
  return {trigger:clamp(med(trig)),target:clamp(med(targ)),n:trig.length};
};

C.parsePromoSpec=function(txt){

    const m=seg.match(/^[wW]?(\d{1,2})\s*(?:[-–~]\s*[wW]?(\d{1,2}))?\s*[:：]?\s*(.*)$/);
    if(!m)return;

/* ---------- 大促爆发系数:大促周周均 SO ÷ 平销周周均 SO(该型号全单元合并,取近一年) ---------- */
C.burstOf=function(units,isPromoOf,blHead){
  const head=blHead!=null?blHead:8;
  let pSum=0,pN=0,fSum=0,fN=0;
  units.forEach(function(u){
    const okSo=function(so){ return u.audio?(so!=null&&so>0):(so!=null); };
    let vi=0;
    const lastP=u.periods.length?u.periods[u.periods.length-1]:0;
    u.periods.forEach(function(p){
      const so=u.weeks.get(p).so;
      if(!okSo(so))return;
      vi++;
      if(vi<=head)return;                          // 首销期不计
      if(C.weekIndex(lastP)-C.weekIndex(p)>52)return;   // 只取近一年
      if(isPromoOf(u,p)){ pSum+=so; pN++; }
      else { fSum+=so; fN++; }
    });
  });
  if(pN<2||fN<4||fSum<=0)return null;
  const r=(pSum/pN)/(fSum/fN);
  return +Math.max(1,Math.min(10,r)).toFixed(2);
};

/* ---------- Theil-Sen 稳健斜率:两两点对斜率的中位数,抗离群 ---------- */
C.theilSen=function(pts){
  if(!pts||pts.length<4)return 0;
  const sl=[];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[j][0]-pts[i][0];
    if(dx!==0)sl.push((pts[j][1]-pts[i][1])/dx);
  }
  if(!sl.length)return 0;
  sl.sort(function(a,b){return a-b;});
  return sl[Math.floor(sl.length/2)];
};

/* ---------- 平销期识别:所有 SO 预测的锚 ----------
   剔除五类污染周后取中位数:
   ① 首销期(首个有效周起 blHead 周,默认 8)
   ② 尾部衰退段(仅当尾部确有持续衰退:尾 6 有效周中位 < 全期中位×0.6;或 eolP 之后)
   ③ 大促周(国家周历命中 或 周季节系数 > blKappa,默认 1.25)
   ④ 缺货周(双条件,用户 2026-08-31 拍板:SO < 0.7×初步中位 且 周初库存 < 2×初步中位
     ——库存充足的大促后回落不算缺货,只有"低库存+低销"同时成立才是供给约束)
   ⑤ 无效周(音频未报量等既有口径)
   返回 {base,delta,conf,n,nAll,excl,usedPeriods};delta=Theil-Sen 周环比,限幅 [-3%,+1%]。 */
C.baselineOf=function(u,opts){
  opts=opts||{};
  const head=(opts.blHead!=null?opts.blHead:8);
  const kappa=(opts.blKappa!=null?opts.blKappa:1.25);
  const kdef=opts.kdef||{};
  const isPromo=opts.isPromo||function(){return false;};
  const eolP=opts.eolP||null;
  const endP=opts.endP||null;   // 回测截断:只用 ≤endP 的历史
  const excl={launch:0,tail:0,promo:0,oos:0,invalid:0};
  /* 有效周 */
  const valid=[];
  let lastInv=null;
  u.periods.forEach(function(p){
    if(endP!=null&&p>endP)return;
    const wk=u.weeks.get(p);
    const so=wk.so;
    const invStart=lastInv;                       // 周初库存=上一个有库存记录的周的库存
    const stock=wk.inv!=null?wk.inv:wk.inv1;
    if(stock!=null)lastInv=stock;
    const ok=u.audio?(so!=null&&so>0):(so!=null);
    if(!ok){ excl.invalid++; return; }
    valid.push({p:p,so:so,invStart:invStart});
  });
  const nAll=valid.length;
  if(!nAll)return {base:null,delta:0,conf:'none',n:0,nAll:0,excl:excl,usedPeriods:[]};
  /* ① 首销期 ② eol 之后 */
  let pool=valid.filter(function(v,i){
    if(i<head){ excl.launch++; return false; }
    if(eolP!=null&&v.p>=eolP){ excl.tail++; return false; }
    return true;
  });
  /* ② 尾部衰退段(仅当确有衰退) */
  if(pool.length>=12){
    const allMed=C.medianOf(pool.map(function(v){return v.so;}))||0;
    const tail6=pool.slice(-6).map(function(v){return v.so;});
    const tailMed=C.medianOf(tail6)||0;
    if(allMed>0&&tailMed<allMed*0.6){
      /* 从尾部向前找衰退起点:连续低于 0.7×全期中位 的最长尾段 */
      let cut=pool.length;
      for(let i=pool.length-1;i>=0;i--){
        if(pool[i].so<allMed*0.7)cut=i; else break;
      }
      if(cut<pool.length){ excl.tail+=pool.length-cut; pool=pool.slice(0,cut); }
    }
  }
  /* ③ 大促周 */
  pool=pool.filter(function(v){
    const w=C.periodW(v.p);
    const k=kdef[w];
    if(isPromo(v.p)||(k!=null&&k>kappa)){ excl.promo++; return false; }
    return true;
  });
  /* ④ 缺货周:双条件 */
  const m0=C.medianOf(pool.map(function(v){return v.so;}))||0;
  const used=pool.filter(function(v){
    if(m0>0&&v.so<0.7*m0&&v.invStart!=null&&v.invStart<2*m0){ excl.oos++; return false; }
    return true;
  });
  const n=used.length;
  if(!n)return {base:null,delta:0,conf:'none',n:0,nAll:nAll,excl:excl,usedPeriods:[]};
  const base=C.medianOf(used.map(function(v){return v.so;}));
  /* 漂移:对 (序号,SO) 做 Theil-Sen,换算为周环比并限幅 */
  let delta=0;
  if(n>=6&&base>0){
    const pts=used.map(function(v,i){ return [i,v.so]; });
    delta=C.theilSen(pts)/base;
    if(delta<-0.03)delta=-0.03;
    if(delta>0.01)delta=0.01;
  }
  const conf=n>=10?'high':(n>=6?'mid':'low');
  return {base:Math.round(base*10)/10,delta:+delta.toFixed(4),conf:conf,n:n,nAll:nAll,excl:excl,
    usedPeriods:used.map(function(v){return v.p;})};
};

/* ---------- 渠道级周期大促识别(Casona NightSale 类) ----------
   对每个渠道:全产品周 SO 聚合,按年归一(周值÷该年中位),同一周号在 ≥minYears 个年份放量 ≥liftTh
   → 该渠道的周期性大促候选。相邻周合并为区间。结果供人工确认后参与平销剔除。 */
C.chanPromoScan=function(store,opts){
  opts=opts||{};
  const liftTh=opts.liftTh||1.6, minYears=opts.minYears||2;
  const acc={};   // account -> {y -> {w -> so}}
  store.units.forEach(function(u){
    let a=acc[u.account]; if(!a)a=acc[u.account]={};
    u.periods.forEach(function(p){
      const so=u.weeks.get(p).so;
      const ok=u.audio?(so!=null&&so>0):(so!=null);
      if(!ok)return;
      const y=C.periodY(p), w=C.periodW(p);
      let yy=a[y]; if(!yy)yy=a[y]={};
      yy[w]=(yy[w]||0)+so;
    });
  });
  const out=[];
  Object.keys(acc).forEach(function(account){
    const a=acc[account];
    const years=Object.keys(a);
    if(years.length<minYears)return;
    const medY={};
    years.forEach(function(y){
      const vals=Object.keys(a[y]).map(function(w){ return a[y][w]; }).filter(function(v){ return v>0; });
      medY[y]=vals.length>=8?C.medianOf(vals):null;   // 该年样本太少不参与
    });
    const hot={};   // w -> {n,liftSum}
    years.forEach(function(y){
      if(!medY[y])return;
      Object.keys(a[y]).forEach(function(w){
        const lift=a[y][w]/medY[y];
        if(lift>=liftTh){ let e=hot[w]; if(!e)e=hot[w]={n:0,liftSum:0}; e.n++; e.liftSum+=lift; }
      });
    });
    const ws=Object.keys(hot).map(Number).filter(function(w){ return hot[w].n>=minYears; }).sort(function(x,y){return x-y;});
    if(!ws.length)return;
    const spans=[];
    let s=ws[0],e=ws[0],liftAcc=hot[ws[0]].liftSum/hot[ws[0]].n,cnt=1;
    for(let i=1;i<ws.length;i++){
      if(ws[i]===e+1){ e=ws[i]; liftAcc+=hot[ws[i]].liftSum/hot[ws[i]].n; cnt++; }
      else { spans.push({w1:s,w2:e,lift:+(liftAcc/cnt).toFixed(2)}); s=e=ws[i]; liftAcc=hot[ws[i]].liftSum/hot[ws[i]].n; cnt=1; }
    }
    spans.push({w1:s,w2:e,lift:+(liftAcc/cnt).toFixed(2)});
    out.push({account:account,spans:spans,years:years.length});
  });
  return out;
};

/* ---------- 退市规律学习:残值水位与衰减率(退市库存不会降到零,用户 2026-08-31 拍板) ----------
   已退市判定:末次显著 SI 距最新周 ≥26 周(或从无显著 SI 但有过销量),且近 8 有效周中位 < 全期中位×0.3。
   学习:残值库存(当前存量)、残值周销/全期中位之比、末次 SI 后的几何衰减率(log-Theil-Sen)。
   聚合:产品系族中位 → 产品线中位 → 全局中位。 */
C.eolLearn=function(store,cfg,familyOf){
  const items=[];
  store.units.forEach(function(u){
    const okSo=function(so){ return u.audio?(so!=null&&so>0):(so!=null); };
    const soSeq=[]; let invNow=null;
    u.periods.forEach(function(p){
      const wk=u.weeks.get(p);
      if(okSo(wk.so))soSeq.push({p:p,so:wk.so});
      const stock=wk.inv!=null?wk.inv:wk.inv1;
      if(stock!=null)invNow=stock;
    });
    if(soSeq.length<20)return;
    const allMed=C.medianOf(soSeq.map(function(x){return x.so;}));
    if(!allMed||allMed<=0)return;
    const tail8=soSeq.slice(-8).map(function(x){return x.so;});
    const tailMed=C.medianOf(tail8)||0;
    if(tailMed>=allMed*0.3)return;              // 尚未进入残值状态
    const rs=C.replenishStats(u,cfg||{});
    const lastSI=rs.lastSI;
    if(lastSI!=null&&(C.weekIndex(store.maxPeriod)-C.weekIndex(lastSI))<26)return;   // 距今不足 26 周不算退市
    /* 衰减率:峰值(或末次SI)之后的 log 斜率 */
    let from=0;
    if(lastSI!=null){ for(let i=0;i<soSeq.length;i++){ if(soSeq[i].p>lastSI){ from=i; break; } } }
    else { let mx=0; soSeq.forEach(function(x,i){ if(x.so>soSeq[mx].so)mx=i; }); from=mx; }
    const seg=soSeq.slice(from).filter(function(x){ return x.so>0; });
    let rho=null;
    if(seg.length>=6){
      const pts=seg.map(function(x,i){ return [i,Math.log(x.so)]; });
      const sl=C.theilSen(pts);
      rho=Math.exp(sl);
      if(rho<0.8)rho=0.8; if(rho>0.99)rho=0.99;
      rho=+rho.toFixed(3);
    }
    items.push({key:u.key,Garnet:u.Garnet,product:u.product,
      fam:familyOf?(familyOf(u.product)?familyOf(u.product).family:null):null,
      resInv:invNow,resSoRatio:+(tailMed/allMed).toFixed(3),rho:rho});
  });
  const agg=function(pick){
    const g={};
    items.forEach(function(it){
      const k=pick(it); if(k==null)return;
      let e=g[k]; if(!e)e=g[k]={inv:[],rho:[]};
      if(it.resInv!=null)e.inv.push(it.resInv);
      if(it.rho!=null)e.rho.push(it.rho);
    });
    const out={};
    Object.keys(g).forEach(function(k){
      out[k]={resInv:C.medianOf(g[k].inv),rho:g[k].rho.length?+(C.medianOf(g[k].rho)).toFixed(3):null,n:g[k].inv.length};
    });
    return out;
  };
  const rhoAll=items.map(function(x){return x.rho;}).filter(function(x){return x!=null;});
  const invAll=items.map(function(x){return x.resInv;}).filter(function(x){return x!=null;});
  return {items:items,byFam:agg(function(it){return it.fam;}),byLine:agg(function(it){return it.Garnet;}),
    global:{resInv:invAll.length?C.medianOf(invAll):null,
      rho:rhoAll.length?+(C.medianOf(rhoAll)).toFixed(3):null,n:items.length}};
};

/* ---------- EOL 衰减后处理:末次 SI(eolP)之后 SO 按几何衰减,手工改写不动 ---------- */
C.applyEolDecay=function(fc,eolP,rho,step){
  if(eolP==null||!fc||!fc.length)return fc;
  const r=(rho!=null&&rho>0&&rho<1)?rho:0.93;
  let idx0=-1;
  for(let i=0;i<fc.length;i++){ if(fc[i].p>eolP){ idx0=i; break; } }
  if(idx0<0)return fc;
  const anchor=idx0>0?(fc[idx0-1].so||0):(fc[0].so||0);
  const st=step||1; let cumRaw=0,cumOut=0;
  for(let i=idx0;i<fc.length;i++){
    if(fc[i].src==='override')continue;
    const raw=Math.max(0,anchor*Math.pow(r,i-idx0+1));
    let out;
    if(st<=1)out=Math.round(raw);
    else { cumRaw+=raw; const tgt=Math.round(cumRaw/st)*st; out=Math.max(0,tgt-cumOut); cumOut+=out; }   // 衰减尾段累计取整
    fc[i]={p:fc[i].p,so:out,src:'eol'};
  }
  return fc;
};

/* ---------- 渠道起量基线:首次显著 SI → SO 达到平销 80%(连续2有效周)用时 ---------- */
C.rampOf=function(u,base,cfg){
  if(base==null||base<=0)return null;
  const rs=C.replenishStats(u,cfg||{});
  if(!rs.events.length)return null;
  const firstSI=rs.events[0].p;
  const okSo=function(so){ return u.audio?(so!=null&&so>0):(so!=null); };
  const seq=[];
  u.periods.forEach(function(p){
    if(p<firstSI)return;
    const so=u.weeks.get(p).so;
    if(okSo(so))seq.push({p:p,so:so});
  });
  for(let i=0;i<seq.length-1;i++){
    if(seq[i].so>=0.8*base&&seq[i+1].so>=0.8*base){
      const w=C.weekIndex(seq[i].p)-C.weekIndex(firstSI);
      return Math.max(1,Math.min(26,w));
    }
  }
  return null;
};

/* ---------- 新品 SI/SO 模拟:纯函数,可测 ----------
   爬坡(线性×首销脉冲)→平销(b̂×季节×增速)→(生命周期内);SI=首批铺货+DOS 触发补货;SO 受库存硬约束。 */
C.simNewProduct=function(o){
  const fw=o.fw||[], firstP=o.firstP, rampW=Math.max(1,o.rampW||2);
  const base=o.base||0, alpha=o.alpha||1.4, g=o.growth||1;
  const kdef=o.kdef||{};
  const trigger=o.trigger||60, target=o.target||90;
  const step=o.roundTo||5;
  const eolP=o.eolP||null;
  const ovSO=o.ovSO||{}, ovSI=o.ovSI||{};   // 推演编辑「新品」看板的手拍(2026-09-01)
  let inv=0; const rows=[]; let started=false, si0=false, iRamp=0;
  const win=[];   // 近4周 SO 窗口(算 DOS)
  fw.forEach(function(p){
    const tapSO=ovSO[p]!=null, tapSI=ovSI[p]!=null;
    if(eolP!=null&&p>eolP&&!tapSO&&!tapSI){ rows.push({p:p,so:0,si:0,inv:inv,dos:null}); return; }
    if(firstP!=null&&p<firstP&&!tapSO&&!tapSI){ rows.push({p:p,so:0,si:0,inv:0,dos:null}); return; }
    started=true;
    const w=C.periodW(p);
    const k=kdef[w]!=null?kdef[w]:1;
    let si=0;
    if(!si0){ si=o.firstSI!=null?o.firstSI:Math.max(0,C.round5(target*(base*k*g/7),step)||0); si0=true; }
    if(tapSI)si=ovSI[p];
    let plan;
    if(iRamp<rampW){
      const frac=(iRamp+1)/rampW;
      plan=base*frac*k*g*(iRamp<4?alpha:1);
    } else plan=base*k*g;
    iRamp++;
    plan=Math.max(0,C.round5(plan,step)||0);
    if(tapSO)plan=ovSO[p];
    inv+=si;
    if(tapSO&&!tapSI&&plan>inv){ const add=C.ceilStep(plan-inv,step); si+=add; inv+=add; }   // 手拍SO高于可售:渠道相应进货补足(进货按步长向上取整,手拍SO原样)
    const so=Math.min(plan,inv);
    inv-=so;
    win.push(so); while(win.length>4)win.shift();
    let s=0; win.forEach(function(v){s+=v;});
    const daily=win.length?s/win.length/7:0;
    const dos=daily>0?Math.round(inv/daily):null;
    if(!tapSI&&si0&&daily>0&&dos!=null&&dos<trigger){
      const add=Math.max(0,C.round5(target*daily-inv,step)||0);
      if(add>0){ si+=add; inv+=add; }
    }
    rows.push({p:p,so:so,si:si,inv:inv,dos:daily>0?Math.round(inv/daily):null,soSrc:tapSO?'override':'newprod',buySrc:tapSI?'override':'rule'});
  });
  return {rows:rows,started:started};
};

/* ---------- 锚品历史平销(新品规划用;2026-09-01 用户:锚定 2025 年有销量的老品,新品必须能按它的历史销量模拟) ----------
   不看"现在还卖不卖",看它在售期卖得怎样:在售期 = 首个 SO>0 周 → 末个 SO>0 周;
   基准 = 同一套平销算法(去首销期/尾部衰退/大促/缺货周取中位)只喂在售期内的历史(endP=末个在售周)——
   此前直接拿看板当前平销,退市老品的近期全是 0,中位被拖成 0,新品一个渠道都铺不出来;
   active = 末个在售周距最新周 ≤8 周(仍在售,此时基准与看板当前平销同口径)。 */
C.anchorHistOf=function(u,opts){
  opts=opts||{};
  const act=[];
  u.periods.forEach(function(p){ const wk=u.weeks.get(p); if(wk&&wk.so!=null&&wk.so>0)act.push({p:p,so:wk.so}); });
  if(!act.length)return {base:null,n:0,firstP:null,lastP:null,lifeWeeks:0,peak:0,active:false,src:'none',conf:'none'};
  const firstP=act[0].p,lastP=act[act.length-1].p;
  const lifeWeeks=C.weekIndex(lastP)-C.weekIndex(firstP)+1;
  let peak=0; act.forEach(function(v){ if(v.so>peak)peak=v.so; });
  const maxP=opts.maxPeriod!=null?opts.maxPeriod:u.periods[u.periods.length-1];
  const active=maxP!=null?(C.weekIndex(maxP)-C.weekIndex(lastP)<=8):true;
  const bl=C.baselineOf(u,{kdef:opts.kdef||{},blHead:opts.blHead,blKappa:opts.blKappa,isPromo:opts.isPromo,endP:lastP});
  let base=(bl&&bl.base!=null&&bl.base>0)?bl.base:null, src='baseline';
  if(base==null){ base=C.medianOf(act.map(function(v){return v.so;})); src='activeMedian'; }   // 有效周太少:退回在售周中位
  return {base:Math.round(base*10)/10,n:bl?bl.n:act.length,firstP:firstP,lastP:lastP,lifeWeeks:lifeWeeks,peak:peak,active:active,src:src,conf:bl?bl.conf:'low'};
};
/* 新品推演窗口终止年:至少到明年年底;上市+生命周期落到更晚就跟到那一年(用户 2026-09-01:27 年上市的新品必须看到 27 年的量);封顶 4 年 */
C.npWindowEndYear=function(curY,launch,lifeWeeks){
  let endY=curY+1;
  if(launch){ const eol=C.addWeeksP(launch,Math.max(1,lifeWeeks||52)); const y=C.periodY(eol); if(y>endY)endY=y; }
  return Math.min(endY,curY+4);
};
/* ---------- 锁量贯通到延伸段(预算月行):某型号明年自动 SI/Purchase 总量 ≤ 预算,超出按比例压缩并逐单元重链月末库存 ----------
   rows=预算底表行(BUDGET_HEADERS 列位:4国家 5渠道 6源 7年 9月 10SO 11SI 12月末库存 13RRP 14/15金额 16备注 17型号);
   idxs=该型号延伸段行下标;返回压缩系数(不需压缩返回 null)。SI 按步长向下取整;SO 受 期初+SI 硬约束(2026-09-02 用户:锁量后不可能还持续 SI,总量必须对齐) */
C.squeezeMonthRows=function(rows,idxs,budget,step,tag){
  step=step||5;
  let sum=0; idxs.forEach(function(i){ sum+=(+rows[i][11]||0); });
  if(sum<=budget+1e-9)return null;
  const f=sum>0?Math.max(0,budget/sum):0;
  const flo=function(v){ return Math.max(0,Math.floor(v/step+1e-9)*step); };
  const byU={};
  idxs.forEach(function(i){ const r=rows[i]; const k=r[4]+'|'+r[5]+'|'+r[6]+'|'+String(r[17]==null?'':r[17]); (byU[k]=byU[k]||[]).push(i); });
  Object.keys(byU).forEach(function(k){
    const list=byU[k].sort(function(a,b){ return (rows[a][7]-rows[b][7])||(rows[a][9]-rows[b][9]); });
    let inv=null;
    list.forEach(function(i){
      const r=rows[i];
      if(inv==null)inv=(+r[12]||0)-(+r[11]||0)+(+r[10]||0);   // 期初=月末−SI+SO
      const si=flo((+r[11]||0)*f);
      let so=+r[10]||0; if(so>inv+si)so=Math.max(0,Math.round(inv+si));
      inv=inv+si-so;
      r[10]=so; r[11]=si; r[12]=Math.round(inv);
      if(r[13]!==''&&r[13]!=null){ r[14]=Math.round(so*r[13]); r[15]=Math.round(si*r[13]); }
      if(tag)r[16]=(r[16]?r[16]+';':'')+tag;
    });
  });
  return +f.toFixed(3);
};
/* ---------- FSD ⇄ 下游 对账(2026-09-02 用户口径:FSD=直接渠道加总=总量,下游=其拆分) ----------
   理论上 Σ下游SO = FSD SO;FSD总库存(Inventory) = FSD自有库存(Inventory1) + Σ下游库存。
   粒度=国家×产品(型号各自加总);窗口=两表都有 SO 的共同周里最近 N 周;库存取最近共同周(缺则取其前最近一周)。
   状态:|差异%| ≤5% OK / ≤15% 注意 / >15% 异常;只有一边有数据 → 缺下游 / 缺FSD。 */
/* 直接渠道类型按名称猜(2026-09-02):online/own/operator/retail 都是「直签·直达消费者」;_DRP=直签零售伙伴;猜不出返回 null(应用层按分销处理) */
C.chanTypeGuess=function(name){ const s=String(name||'').toLowerCase();
  if(/amazon|\bamz\b|mercado|\bmeli\b|linio|\bebay\b|shopee|aliexpress|walmart\.com|\bml\b/.test(s))return 'online';
  if(/eshop|e-shop|商城|acme ?store|自营|\bhsc\b|_bra\b|brand ?store|体验店|experience/.test(s))return 'own';
  if(/telcel|\bclaro\b|movistar|\btigo\b|telcom|\bentel\b|\bwom\b|bitel|telefonica|at&t|\bantel\b|\bcnt\b|operador|\bune\b|\bvtr\b/.test(s))return 'operator';
  if(/_drp\b|direct ?retail/.test(s))return 'retail';
  return null; };
/* ---------- 凑数推荐(2026-09-02 用户:某上游已连了几家下游,还差的 SO/库存缺口刚好等于某(几)家未连线下游 → 推荐它归这家) ----------
   输入:store/retailStore + 范围(Drift,Garnet 可空) + wired{下游:上游}(生效连线) + types{直接渠道:类型}(只给带下游型找) + weeks 窗口 + tol 容差 + maxK 组合上限
   缺口:SO = 上游窗口SO − Σ已连下游SO;库存 = 上游总库存 − INV1 − Σ已连下游库存(FSD 总库存 = INV1 + Σ下游库存)。
   在未连线下游里枚举 1~maxK 家组合,两项相对误差都 ≤ tol 的按误差和排序;一家下游只推荐给误差最小的上游,一个上游只出一条推荐。 */
C.suggestWiring=function(store,retailStore,o){
  o=o||{}; const Drift=o.Drift, Garnet=o.Garnet||'', N=o.weeks||8, tol=o.tol!=null?o.tol:0.15, maxK=o.maxK||3;
  const wired=o.wired||{}, types=o.types||{};
  const out=[];
  if(!store||!retailStore||!store.units||!retailStore.units)return out;
  const okU=function(u){ return u.Drift===Drift&&!u.audio&&(!Garnet||u.Garnet===Garnet); };
  const pf={},pr={};
  store.units.forEach(function(u){ if(!okU(u))return; u.periods.forEach(function(p){ if(u.weeks.get(p).so!=null)pf[p]=1; }); });
  retailStore.units.forEach(function(u){ if(!okU(u))return; u.periods.forEach(function(p){ if(u.weeks.get(p).so!=null)pr[p]=1; }); });
  const common=Object.keys(pf).filter(function(p){ return pr[p]; }).map(Number).sort(function(a,b){return a-b;});
  if(!common.length)return out;
  const win=common.slice(-N); const wset={}; win.forEach(function(p){ wset[p]=1; }); const lastP=win[win.length-1];
  const soWin=function(u){ let s=0; u.periods.forEach(function(p){ if(!wset[p])return; const w=u.weeks.get(p); if(w.so!=null)s+=w.so; }); return s; };
  const par={},ds={};
  store.units.forEach(function(u){ if(!okU(u))return; let e=par[u.account]; if(!e)e=par[u.account]={account:u.account,so:0,inv:0,inv1:0};
    e.so+=soWin(u); const inv=C.latestFieldAt(u,'inv',lastP), inv1=C.latestFieldAt(u,'inv1',lastP); if(inv!=null)e.inv+=inv; if(inv1!=null)e.inv1+=inv1; });
  retailStore.units.forEach(function(u){ if(!okU(u))return; let e=ds[u.account]; if(!e)e=ds[u.account]={account:u.account,so:0,inv:0};
    e.so+=soWin(u); const inv=C.latestFieldAt(u,'inv',lastP); if(inv!=null)e.inv+=inv; });
  const gaps=[];
  const mirrored={}; Object.keys(wired).forEach(function(d){ const pp=wired[d]; if(pp&&pp!=='*'&&(types[pp]||'dist')!=='dist')mirrored[pp]=1; });
  Object.keys(par).forEach(function(k){ const tp=types[k]||'dist'; const e=par[k];
    if(tp!=='dist'){ if(mirrored[k]||e.so<=0)return; gaps.push({parent:k,needSO:e.so,needInv:e.inv,mirror:true}); return; }   // 直达渠道:整体 SO/库存 应等于间接表里同名那一行(同一家),只找单家
    let wSo=0,wInv=0; Object.keys(wired).forEach(function(d){ if(wired[d]===k&&ds[d]){ wSo+=ds[d].so; wInv+=ds[d].inv; } });
    const needSO=e.so-wSo, needInv=e.inv-e.inv1-wInv;
    if(needSO<=0)return;
    gaps.push({parent:k,needSO:needSO,needInv:needInv,mirror:false}); });
  const free=Object.keys(ds).filter(function(d){ return wired[d]==null; }).map(function(d){ return ds[d]; });
  if(!gaps.length||!free.length)return out;
  const combos=[]; const nF=free.length;
  const walk=function(start,pick){ if(pick.length)combos.push(pick.slice()); if(pick.length>=maxK||combos.length>20000)return;
    for(let i=start;i<nF;i++){ pick.push(i); walk(i+1,pick); pick.pop(); if(combos.length>20000)return; } };
  walk(0,[]);
  const cands=[];
  gaps.forEach(function(g){ combos.forEach(function(cb){ if(g.mirror&&cb.length!==1)return; let s=0,v=0; cb.forEach(function(i){ s+=free[i].so; v+=free[i].inv; });
    if(s<=0)return;
    const errSO=Math.abs(s-g.needSO)/Math.max(1,g.needSO);
    const invOk=g.needInv>0; const errInv=invOk?Math.abs(v-g.needInv)/Math.max(1,g.needInv):null;
    if(errSO>tol+1e-9)return; if(invOk&&errInv>tol+1e-9)return;
    if(!invOk&&v>Math.max(20,g.needSO))return;   // 库存缺口不可核对(≤0)时,候选不能带着明显库存
    cands.push({parent:g.parent,idx:cb,gotSO:s,gotInv:v,errSO:errSO,errInv:errInv,needSO:g.needSO,needInv:g.needInv,mirror:!!g.mirror,
      score:errSO+(errInv!=null?errInv:0.5)+cb.length*0.01}); }); });
  cands.sort(function(a,b){ return a.score-b.score; });
  const usedDs={},usedP={};
  cands.forEach(function(c){ if(usedP[c.parent])return; if(c.idx.some(function(i){ return usedDs[i]; }))return;
    usedP[c.parent]=1; c.idx.forEach(function(i){ usedDs[i]=1; });
    out.push({parent:c.parent,ds:c.idx.map(function(i){ return free[i].account; }),needSO:Math.round(c.needSO),gotSO:Math.round(c.gotSO),errSO:+c.errSO.toFixed(3),
      needInv:Math.round(c.needInv),gotInv:Math.round(c.gotInv),errInv:c.errInv!=null?+c.errInv.toFixed(3):null,invChecked:c.errInv!=null,mirror:c.mirror,score:+c.score.toFixed(3)}); });
  return out;
};
/* 下游锁量预算(2026-09-02 用户:锁量总量是全生命周期天花板,包含下游渠道库存与 INV1):
   下游未来还能进的量 = min(物理可流量 INV1+余量, 守恒天花板 锁量总量−下游生命周期累计Purchase);useInv1=false 时物理项只算余量 */
C.retailLockBudget=function(o){ o=o||{};
  const phys=(o.useInv1===true?(o.inv1||0):0)+Math.max(0,o.remain||0);   // 默认严格口径(2026-09-02 用户:Purchase 就是 SI,不能大于剩余待SI);useInv1=true 才把分销商库存算进来
  const cons=Math.max(0,(o.total||0)-(o.lifePurchase||0));
  return Math.max(0,Math.min(phys,cons)); };
/* ===== 月口径(2026-09-02 用户:数据准确性第一——某月 4 周或 5 周,DOS 必须按该月实际天数) =====
   月=各周按周四归属(ISO 8601,用户 2026-08-26 拍板);月天数=该月周数×7(4 周=28 天,5 周=35 天);
   月SO=该月各周 SO 合计(已发生周取底表实际,未发生周取推演);月末库存=该月最后一周(周末时点)库存;
   月末DOS=月末库存÷(月SO÷月天数)。全软件统一,不再有 ÷30、÷近4周日均 的月末口径(当前DOS 另算:当前库存÷近4周日均)。 */
C.monthWeeksOf=function(y,m){ const out=[]; const nW=C.weeksInISOYear(y); for(let w=1;w<=nW;w++){ const p=C.mkPeriod(y,w); if(C.monthOfP(p)===m)out.push(p); } return out; };
C.monthDaysOf=function(y,m){ return C.monthWeeksOf(y,m).length*7; };
C.monthDos=function(inv,so,days){ if(inv==null)return null; if(!(so>0))return inv>0?Infinity:null; if(!(days>0))return null; return Math.round(inv/(so/days)); };
C.unitMonthSO=function(u,simRows,y,m){ const simMap={}; (simRows||[]).forEach(function(r){ simMap[r.p]=r; });
  let so=0; C.monthWeeksOf(y,m).forEach(function(p){ const r=simMap[p]; if(r){ so+=(r.so||0); return; } const w=(u&&u.weeks)?u.weeks.get(p):null; if(w&&w.so!=null)so+=w.so; }); return so; };
C.dosText=function(dv){ return dv==null?'—':(dv===Infinity?'∞':C.fmt(dv)); };
C.latestFieldAt=function(u,fld,p){
  let v=null,vp=-1;
  u.periods.forEach(function(q){ if(q>p||q<vp)return; const w=u.weeks.get(q); if(w&&w[fld]!=null){ v=w[fld]; vp=q; } });
  return v;
};
C.reconcileFsdRetail=function(store,retailStore,opts){
  opts=opts||{};
  const N=opts.weeks||8;
  const skipAudio=opts.skipAudio!==false;   // 音频下游是报量制,默认不对账
  const types=opts.types||null;   // 国家||直接渠道 → dist/retail/operator/online/own(渠道架构页):只有带下游型(分销)的 SO 与下游对,直达消费者型不对
  const tree=opts.tree||null;     // 国家 → {下游渠道:上游直接渠道名|'*'}(渠道架构页连线):给了就多出按直接渠道细分的对账行
  const out={rows:[],byDirect:[],window:[],lastP:null,sum:null};
  if(!store||!retailStore||!store.units||!retailStore.units)return out;
  const pf={},pr={};
  store.units.forEach(function(u){ if(skipAudio&&u.audio)return; u.periods.forEach(function(p){ if(u.weeks.get(p).so!=null)pf[p]=1; }); });
  retailStore.units.forEach(function(u){ if(skipAudio&&u.audio)return; u.periods.forEach(function(p){ if(u.weeks.get(p).so!=null)pr[p]=1; }); });
  const common=Object.keys(pf).filter(function(p){ return pr[p]; }).map(Number).sort(function(a,b){return a-b;});
  if(!common.length)return out;
  const win=common.slice(-N); const wset={}; win.forEach(function(p){ wset[p]=1; });
  const lastP=win[win.length-1];
  out.window=win; out.lastP=lastP;
  const typeOf=function(u){ if(!types)return 'dist'; const c=u.Drift||''; return types[c+'||'+(u.Garnet||'')+'||'+u.account]||types[c+'||'+u.account]||'dist'; };   // 产业键优先,兼容旧的国家键
  const g={},gd={};
  const get=function(u){ const k=(u.Drift||'')+'||'+(u.product||''); let e=g[k];
    if(!e)e=g[k]={Drift:u.Drift||'',product:u.product||'',Garnet:u.Garnet||'',nFsd:0,nDs:0,fsdSO:0,directSO:0,dsSO:0,fsdInv:null,inv1:null,dsInv:null};
    return e; };
  const getD=function(Drift,Garnet,account){ const k=Drift+'||'+Garnet+'||'+account; let e=gd[k];
    if(!e)e=gd[k]={Drift:Drift,Garnet:Garnet,account:account,type:null,mirror:false,nFsd:0,fsdSO:0,fsdInv:null,inv1:null,dsSO:0,dsInv:null,children:[]};
    return e; };
  const treeOf=function(c,Garnet){ return tree[c+'||'+(Garnet||'')]||tree[c]||{}; };   // 产业键优先,兼容旧的国家键
  /* 同一家(2026-09-02 用户:Amazon 这类直达渠道有时在间接零售伙伴表里也出现):下游行连到直达型直接渠道 = 同一家的镜像,不是下游伙伴 →
     它的 SO 计入 FSD 侧与下游对;库存按同一家核对(FSD Inventory vs 镜像行库存),INV1 不再加一次 */
  const typeAt=function(c,Garnet,acct){ if(!types)return 'dist'; return types[c+'||'+(Garnet||'')+'||'+acct]||types[c+'||'+acct]||'dist'; };
  const mirrors={};
  if(tree)Object.keys(tree).forEach(function(k){ const ix=k.indexOf('||'); const c=ix<0?k:k.slice(0,ix), ln=ix<0?'':k.slice(ix+2); const tr=tree[k]||{};
    Object.keys(tr).forEach(function(d){ const par=tr[d]; if(par&&par!=='*'&&typeAt(c,ln,par)!=='dist')mirrors[c+'||'+ln+'||'+par]=1; }); });
  const isMirrorOf=function(c,Garnet,acct){ return !!(mirrors[c+'||'+(Garnet||'')+'||'+acct]||mirrors[c+'||||'+acct]); };
  const soWin=function(u){ let s=0; u.periods.forEach(function(p){ if(!wset[p])return; const w=u.weeks.get(p); if(w.so!=null)s+=w.so; }); return s; };
  store.units.forEach(function(u){ if(skipAudio&&u.audio)return;
    const e=get(u); e.nFsd++;
    const tp=typeOf(u); const so=soWin(u);
    const mir=tp!=='dist'&&tree&&isMirrorOf(u.Drift||'',u.Garnet||'',u.account);
    if(tp==='dist'||mir)e.fsdSO+=so; else e.directSO+=so;
    const inv=C.latestFieldAt(u,'inv',lastP), inv1=C.latestFieldAt(u,'inv1',lastP);
    if(inv!=null)e.fsdInv=(e.fsdInv||0)+inv;
    if(inv1!=null&&!mir)e.inv1=(e.inv1||0)+inv1;   // 同一家:库存由镜像行代表,INV1 不再加
    if(tree){ const d=getD(u.Drift||'',u.Garnet||'',u.account); d.nFsd++; d.type=tp; d.mirror=!!mir; d.fsdSO+=so;
      if(inv!=null)d.fsdInv=(d.fsdInv||0)+inv; if(inv1!=null)d.inv1=(d.inv1||0)+inv1; }
  });
  retailStore.units.forEach(function(u){ if(skipAudio&&u.audio)return;
    const e=get(u); e.nDs++;
    const so=soWin(u); e.dsSO+=so;
    const inv=C.latestFieldAt(u,'inv',lastP);
    if(inv!=null)e.dsInv=(e.dsInv||0)+inv;
    if(tree){ const c=u.Drift||''; const tr=treeOf(c,u.Garnet); const par=tr[u.account]!=null?tr[u.account]:null;
      const acct=par==null?'(未连线)':(par==='*'?'(国家FSD合计)':par);
      const d=getD(c,u.Garnet||'',acct); if(par==null)d.type='unwired'; else if(par==='*')d.type='Drift';
      if(d.children.indexOf(u.account)<0)d.children.push(u.account);
      d.dsSO+=so; if(inv!=null)d.dsInv=(d.dsInv||0)+inv; }
  });
  const counts={OK:0,'注意':0,'异常':0,'缺下游':0,'缺FSD':0,'直达':0};
  const sum={fsdSO:0,dsSO:0,fsdInv:0,inv1:0,dsInv:0,nBoth:0};
  const rank={'异常':0,'注意':1,'缺下游':2,'缺FSD':3,'直达':4,OK:5};
  Object.keys(g).forEach(function(k){
    const e=g[k];
    e.fsdSOAll=e.fsdSO+e.directSO;
    e.dSO=e.dsSO-e.fsdSO;
    e.pSO=(e.nFsd&&e.nDs)?+((e.dSO)/Math.max(1,Math.abs(e.fsdSO))).toFixed(3):null;
    const both=(e.inv1!=null||e.dsInv!=null)?((e.inv1||0)+(e.dsInv||0)):null;
    e.invSum=both;
    e.dInv=(e.fsdInv!=null&&both!=null)?both-e.fsdInv:null;
    e.pInv=(e.nFsd&&e.nDs&&e.fsdInv!=null&&both!=null)?+((e.dInv)/Math.max(1,Math.abs(e.fsdInv))).toFixed(3):null;
    if(e.nFsd&&!e.nDs)e.status=(e.fsdSO===0&&e.directSO>0)?'直达':'缺下游';
    else if(!e.nFsd&&e.nDs)e.status='缺FSD';
    else { const worst=Math.max(Math.abs(e.pSO||0),Math.abs(e.pInv||0)); e.status=worst<=0.05?'OK':(worst<=0.15?'注意':'异常');
      sum.fsdSO+=e.fsdSO; sum.dsSO+=e.dsSO; sum.fsdInv+=(e.fsdInv||0); sum.inv1+=(e.inv1||0); sum.dsInv+=(e.dsInv||0); sum.nBoth++; }
    counts[e.status]++;
    out.rows.push(e);
  });
  out.rows.sort(function(a,b){ return (rank[a.status]-rank[b.status])||(Math.abs(b.dSO)-Math.abs(a.dSO))||(a.Drift<b.Drift?-1:1); });
  sum.counts=counts;
  sum.pSO=sum.nBoth?+((sum.dsSO-sum.fsdSO)/Math.max(1,Math.abs(sum.fsdSO))).toFixed(3):null;
  sum.pInv=sum.nBoth?+(((sum.inv1+sum.dsInv)-sum.fsdInv)/Math.max(1,Math.abs(sum.fsdInv))).toFixed(3):null;
  out.sum=sum;
  /* 按直接渠道细分(需连线):带下游型直接渠道 vs 它名下下游的 Σ;直达消费者型不判;未连线/国家合计单列 */
  if(tree){
    const rankD={'异常':0,'注意':1,'未连线':2,'无下游':3,'国家合计':4,'直达':5,OK:6};
    Object.keys(gd).forEach(function(k){
      const d=gd[k];
      d.nDs=d.children.length;
      d.dSO=d.dsSO-d.fsdSO;
      const both=d.mirror?(d.dsInv!=null?d.dsInv:null):((d.inv1!=null||d.dsInv!=null)?((d.inv1||0)+(d.dsInv||0)):null);   // 同一家:库存按同一家核对,不加 INV1
      d.invSum=both; d.dInv=(d.fsdInv!=null&&both!=null)?both-d.fsdInv:null;
      d.pSO=null; d.pInv=null;
      if(d.type==='unwired')d.status='未连线';
      else if(d.type==='Drift')d.status='国家合计';
      else if(d.type!=='dist'&&!d.mirror)d.status='直达';
      else if(!d.nDs)d.status='无下游';
      else { d.pSO=+((d.dSO)/Math.max(1,Math.abs(d.fsdSO))).toFixed(3);
        d.pInv=(d.fsdInv!=null&&both!=null)?+((d.dInv)/Math.max(1,Math.abs(d.fsdInv))).toFixed(3):null;
        const worst=Math.max(Math.abs(d.pSO||0),Math.abs(d.pInv||0)); d.status=worst<=0.05?'OK':(worst<=0.15?'注意':'异常'); }
      out.byDirect.push(d);
    });
    out.byDirect.sort(function(a,b){ return (rankD[a.status]-rankD[b.status])||(Math.abs(b.dSO)-Math.abs(a.dSO))||(a.Drift<b.Drift?-1:(a.Drift>b.Drift?1:(a.Garnet<b.Garnet?-1:(a.Garnet>b.Garnet?1:(a.account<b.account?-1:1))))); });
  }
  return out;
};

/* ---------- 补货规律显性回测:每 渠道×产品 的历史 SI 节奏 ----------
   事件=显著 SI(≥2×近4周均销);记录触发前 DOS/触发前库存/补后 DOS。
   模式判定:none=从无显著SI / oneshot=上市铺货后≥oneShotWeeks 周再无SI且期间仍有动销(非流水生意,需警惕)
   / flow=流水补货。中位数与 learnReplenish 同口径。 */
C.replenishStats=function(u,cfg){
  const win=(cfg&&cfg.dosWindow)||4;
  const oneShotWeeks=(cfg&&cfg.tailWeeks)||12;
  const q=[]; let prevDos=null,prevInv=null;
  const events=[];
  u.periods.forEach(function(p){
    const wk=u.weeks.get(p);
    const so=wk.so;
    const soValid=u.audio?(so!=null&&so>0):(so!=null);
    if(soValid){ q.push(so); while(q.length>win)q.shift(); }
    let s=0; q.forEach(function(v){s+=v;});
    const daily=q.length?s/q.length/7:0;
    const dos=(wk.inv!=null&&daily>0)?wk.inv/daily:null;
    const avgW=q.length?s/q.length:0;
    if(wk.si!=null&&wk.si>0&&avgW>0&&wk.si>=avgW*2){
      events.push({p:p,si:wk.si,prevDos:prevDos!=null?Math.round(prevDos):null,
        prevInv:prevInv,afterDos:dos!=null?Math.round(dos):null,
        afterInv:wk.inv!=null?Math.round(wk.inv):null});
    }
    if(dos!=null)prevDos=dos;
    if(wk.inv!=null)prevInv=wk.inv;
  });
  const med=function(a){ if(!a.length)return null;
    const b=a.slice().sort(function(x,y){return x-y;}); return Math.round(b[Math.floor(b.length/2)]); };
  const pick=function(f){ const a=[]; events.forEach(function(e){ if(f(e)!=null)a.push(f(e)); }); return a; };
  const lastSI=events.length?events[events.length-1].p:null;
  /* 一次性铺货:最后一次显著 SI 之后 ≥oneShotWeeks 个周期,且其后仍有有效动销记录 */
  let mode='none';
  if(events.length){
    mode='flow';
    if(lastSI!=null){
      const after=u.periods.filter(function(p){ return p>lastSI; });
      let soAfter=0;
      after.forEach(function(p){ const so=u.weeks.get(p).so;
        if(u.audio?(so!=null&&so>0):(so!=null&&so>0))soAfter++; });
      if(after.length>=oneShotWeeks&&soAfter>0&&events.length<=2)mode='oneshot';
    }
  }
  return {n:events.length,events:events,
    trigger:med(pick(function(e){return e.prevDos;})),
    target:med(pick(function(e){return e.afterDos;})),
    trigInv:med(pick(function(e){return e.prevInv;})),
    lastSI:lastSI,mode:mode};
};

/* ---------- 渠道补货策略判型(2026-09-01 用户拍板:每个渠道的补货节奏规律不同,必须先学历史再模拟,禁止全渠道一刀切) ----------
   事件=显著SI(≥2×近4周均销,与 replenishStats 同口径),样本≥3 才学;
   判型看哪个信号更集中(稳健离散度=四分位距÷中位):
   - 水位型 inv:历史每次都在某个绝对库存台数附近进货(如"库存到500台就SI一批")→触发=进货前库存中位,补到=进货后库存中位
   - 门槛型 dos:历史每次都在某个 DOS 附近进货(如"DOS低于90天就要补,否则SO下滑")→沿用 learnReplenish 中位(触发/目标DOS)
   水位判定从严(库存离散度≤0.6×DOS离散度 且 ≤0.5):证据不足回落 DOS 型,学不到返回 null(上层再回落产品线默认)。 */
C.replenishPolicyOf=function(u,cfg,rs0){
  const rs=rs0||C.replenishStats(u,cfg);
  const evs=(rs.events||[]).filter(function(e){ return e.prevDos!=null&&e.prevInv!=null; });
  if(evs.length<3)return null;
  const med=function(a){ const b=a.slice().sort(function(x,y){return x-y;}); return b[Math.floor(b.length/2)]; };
  const rq=function(a){ const b=a.slice().sort(function(x,y){return x-y;});
    const m=b[Math.floor(b.length/2)]; if(m<=0)return 99;
    const q1=b[Math.floor(b.length*0.25)],q3=b[Math.floor(b.length*0.75)];
    return (q3-q1)/m; };
  const dosArr=evs.map(function(e){return e.prevDos;}),invArr=evs.map(function(e){return e.prevInv;});
  const cvD=rq(dosArr),cvI=rq(invArr);
  if(cvI<cvD*0.6&&cvI<=0.5){
    const tin=Math.round(med(invArr));
    const aft=evs.map(function(e){return e.afterInv;}).filter(function(x){return x!=null;});
    const tgt=aft.length?Math.round(med(aft)):null;
    if(tgt!=null&&tgt>tin&&tin>=0){
      const aftD=evs.map(function(e){return e.afterDos;}).filter(function(x){return x!=null;});
      return {type:'inv',triggerInv:tin,targetInv:tgt,n:evs.length,src:'unit',
        targetDos:aftD.length?Math.round(med(aftD)):null,
        cvI:+cvI.toFixed(2),cvD:+cvD.toFixed(2)};
    }
  }
  const lr=C.learnReplenish(u,cfg);
  return lr?{type:'dos',trigger:lr.trigger,target:lr.target,n:lr.n,src:'unit',
    cvI:+cvI.toFixed(2),cvD:+cvD.toFixed(2)}:null;
};

/* ---------- 推演合理性哨兵：相邻月数量级校验 ----------
   把推演按连续4周分块,首块对比最近4个有数周实际,后续块环比;
   块比 > 3×系数比(或 < 1/(3×系数比)) 判异常。返回警示列表(不改数,只提醒)。 */
C.sanityCheck=function(o){
  const fc=o.forecast||[];
  if(!fc.length||fc.some(function(f){return f.so==null;}))return [];
  const kOf=function(w){ const kd=o.kdef&&o.kdef[w]!=null?o.kdef[w]:1; const ke=o.kedit&&o.kedit[w]; return ke==null?kd:ke; };
  const blocks=[];
  for(let i=0;i<fc.length;i+=4){
    const part=fc.slice(i,i+4);
    let so=0,k=0;
    part.forEach(function(f){ so+=f.so; k+=kOf(C.periodW(f.p)); });
    blocks.push({from:part[0].p,to:part[part.length-1].p,so:so,k:k/part.length,n:part.length});
  }
  const warns=[];
  let baseSo=0,baseK=0,baseN=0;
  (o.cur.windowWeeks||[]).forEach(function(p){ baseSo+=o.unit.weeks.get(p).so; baseK+=kOf(C.periodW(p)); baseN++; });
  let prev={so:baseSo*( baseN?4/baseN:1),k:baseN?baseK/baseN:1,label:'近4周实际',n:4};
  const LIM=3;
  blocks.forEach(function(b){
    if(prev.so>0&&b.n>=2){
      const ratio=(b.so/b.n)/((prev.so/prev.n)||1);
      const kRatio=Math.max(0.2,(b.k||1)/(prev.k||1));
      const lim=LIM*Math.max(1,kRatio);
      if(ratio>lim)warns.push({from:b.from,to:b.to,type:'high',ratio:+ratio.toFixed(1),lim:+lim.toFixed(1),
        blockSo:b.so,prevSo:Math.round(prev.so),prevLabel:prev.label});
      else if(ratio<1/lim&&prev.so>=20)warns.push({from:b.from,to:b.to,type:'low',ratio:+ratio.toFixed(2),lim:+(1/lim).toFixed(2),
        blockSo:b.so,prevSo:Math.round(prev.so),prevLabel:prev.label});
    }
    prev={so:b.so,k:b.k,label:C.weekLabel(b.from)+'-'+C.weekLabel(b.to)+'块',n:b.n};
  });
  return warns;
};

/* ---------- 免推演阈值：SKU 覆盖 > 产品线默认 > 全局默认;null=无阈值 ---------- */
C.exemptThreshold=function(exempt,Garnet,model){
  if(!exempt)return null;
  const num=function(v){ return (v==null||v==='')?null:(isFinite(+v)?+v:null); };
  let v=exempt.model?num(exempt.model[model]):null; if(v!=null)return v;
  v=exempt.Garnet?num(exempt.Garnet[Garnet]):null; if(v!=null)return v;
  return num(exempt.global);
};
