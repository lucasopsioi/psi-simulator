      +'（此处为底表实际 SI;其推演进货已按下游同款学习链计算。）</div>'
      +'<div class="tblwrap" style="max-height:26vh"><table class="sortable"><thead><tr>'
      +'<th class="l">国家</th><th class="l">渠道</th><th class="l">产品</th><th class="l">型号</th>'
      +'<th>当前DOS</th><th>近4周SI</th><th>近4周SO</th><th>INV</th></tr></thead><tbody>';
    indirRisk.forEach(function(x){ const u=x.it.u;
      h+='<tr><td class="l">'+esc(u.Drift)+'</td>'
        +'<td class="l ell" title="'+esc(u.account)+'">'+esc(u.account)+'</td>'
        +'<td class="l ell" title="'+esc(u.product)+'">'+esc(u.product)+'</td>'
        +'<td class="l">'+esc(u.model)+'</td>'
        +'<td class="dosLow">'+x.dos+'</td>'
        +'<td class="dosLow">'+F.fmt(x.m.si4)+'</td>'
        +'<td>'+F.fmt(x.m.so4)+'</td>'
        +'<td>'+F.fmt(x.it.cur.curInv)+'</td></tr>'; });
    h+='</tbody></table></div></div>';
  }
  if(eF.length){
    h+='<div class="panel"><h3>模块一：FSD 库存监控（库存有没有 ST 下去;含音频专表项;FSD表内的下游渠道(间接)按动销口径判定）'
      +' <button class="ghost" id="btnExpWF" style="margin-left:8px">导出 Excel</button></h3>'

      +'<div class="tblwrap" style="max-height:38vh"><table class="sortable"><thead><tr>'

      +'<th title="最新有数周与环比">最新周SO(WoW)</th>'

/* ===== 推演编辑：多维推演矩阵(2026-08-31 按用户 Excel 范式重做;当晚扩多年+右键推演逻辑) =====

   数值悬停有简提示,右键弹出完整推演逻辑(平销b̂/大促/增速链/公式,今年月=因子分解,外推年=外推参数卡)。 */
/* 新品规划 → 推演编辑「新品」源:每个 新品×国家×渠道 一个虚拟单元(无历史,只有推演段),四行可拍(ovSO/ovSI 按 NP| 键存) */
function npDx(){
  if(!Dn||!Dn.perNp||!Dn.perNp.length)return null;
  const list=[];
  Dn.perNp.forEach(function(pn){
    pn.units.forEach(function(vu){
      const key=vu.key||('NP|'+pn.np.id+'|'+vu.Drift+'|'+vu.account);
      const u={key:key,Drift:vu.Drift,account:vu.account,Garnet:pn.np.Garnet||'(新品)',product:pn.np.name,model:pn.np.name,   // 型号位=产品名:明年列(预算延伸)按 国家×渠道×型号 取值,否则同渠道两个新品会串
        audio:false,periods:[],weeks:new Map(),rawNames:[vu.account],np:pn.np.id};
      const rows=vu.rows.map(function(r){ return {p:r.p,so:r.so,si:r.si,buy:r.si,inv:r.inv,dos:r.dos,daily:(r.so||0)/7,
        soSrc:r.soSrc||'newprod',buySrc:r.buySrc||'rule'}; });
      list.push({u:u,cur:{curInv:0,curInv1:null,dailySO:vu.base/7,avgWeeklySO:vu.base,windowWeeks:[]},
        sim:{rows:rows,blocked:false},fc:rows.map(function(r){ return {p:r.p,so:r.so,src:r.soSrc}; }),
        exempt:false,ignored:false,bl:null,np:pn.np});
    });
  });
  const stx=retailStore||store||audioStore;
  return {list:list,byKey:new Map(list.map(function(it){ return [it.u.key,it]; })),fw:Dn.fw,monthEnds:F.monthEndPeriods(stx.maxPeriod)};
}
function pvDxOf(){ const s=state.ui.pvSrc;
  return s==='audio'?Da:(s==='retail'?Dr:(s==='np'?npDx():D)); }
const PV2_VIEWS={
  rep:{label:'代表处视图',dims:['rep','Drift','Garnet','product','model','account']},

let ovExtGen=0;
/* 预算外推行 + 手工覆盖(state.ovExt):替换 SO/SI 后按 库存=上月末+SI−SO 重链该单元后续月库存与金额;
   所有外推消费方(推演矩阵/AI nextYear/scopeQuery/预算底表导出)统一走这里,口径不分裂 */
function budgetRowsOv(endYear){
  const c=calcCache();
  const tag=endYear+'|'+ovExtGen;
  if(c.budOv&&c.budOv.tag===tag)return c.budOv.rows;
  if(!c.budTo)c.budTo={};
  if(!c.budTo[endYear]){
    try{ c.budTo[endYear]=buildBudgetRows(endYear); }catch(e){ c.budTo[endYear]=[]; }
  }
  const base=c.budTo[endYear];
  const ov=state.ovExt||{};
  let rows=base;

/* 时间桶:mode=hist(·A)/sim(今年推演,可拍)/ext(外推·E,只读);月按周四归属;histN=历史桶只保留最近 N 个 */

  const wByY={};
  stx.units.forEach(function(u){ u.periods.forEach(function(p2){

    const mk2=function(mFrom,mTo,key,label){
      if(y<=curY){
        const sub=ws.filter(function(p2){ const m=F.monthOfP(p2); return m>=mFrom&&m<=mTo; });
        if(!sub.length)return;
        const anyFut=sub.some(function(p2){ return fwSet[p2]; });
        bks.push({key:key,label:label,y:y,weeks:sub,days:sub.length*7,m:mTo,
          mode:(y===curY&&anyFut)?'sim':'hist',canExp:gran==='month'});

          ws2.forEach(function(p2,wi){

    else if(gran==='quarter'){ for(let q=1;q<=4;q++)mk2(q*3-2,q*3,'Q'+y+'-'+q,'Q'+q); }

    const histIdx=[];
    bks.forEach(function(b2,i2){ if(b2.mode==='hist'&&!b2.mSub)histIdx.push(i2); });
    if(histIdx.length>histN){

     DOS 红线着色留到下次整页渲染再刷 */
  const pv2Patch=function(){

    const aggCache={}; const bIdxOf={}; bks.forEach(function(b2,i2){ bIdxOf[b2.key]=i2; });

        txt=iv==null?'\u2014':(soB>0?F.fmt(dv):(iv>0?'\u221e':'\u2014')); }

      if(k==='so'){ if(a.soCarry&&a.soCarry[bi])td.setAttribute('data-carry','1'); else td.removeAttribute('data-carry'); }
    });

  el.querySelectorAll('td[data-pv2k]').forEach(function(td){

              if(ok2)s2+=(w2.so||0);
            });

      if(!cells.length){ alert('该桶没有可拍的未来周。'); render(); return; }
      let futCur=0; cells.forEach(function(c){ futCur+=c.cur; });
      if(futCur<=0){
        /* 现值全 0(如停售段拍复售):按各单元近26周历史 SO 占比兜底,保住渠道历史经验;历史也没有才均分 */
        const hw={};
        node.items.forEach(function(it){
          const u2=it.u;
          const mi2=F.weekIndex(stx.maxPeriod);
          let s2=0;
          u2.periods.forEach(function(p2){
            if(mi2-F.weekIndex(p2)>=26)return;
            const w2=u2.weeks.get(p2);
            const ok2=u2.audio?(w2.so!=null&&w2.so>0):(w2.so!=null);

          hw[u2.key]=s2;
        });

      }

      const bi=bks.indexOf(bk);
      const shown=Math.round(metric==='so'?a.so[bi]:a.si[bi]);
      const histPart=shown-Math.round(futCur);
      const vFut=Math.max(0,Math.round(v)-histPart);
      const al=distStep(vFut,cells.map(function(c){ return c.cur; }),src);
      const bagName=metric==='so'?'ovSO':'ovSI';
      const bag=state[bagName];
      pushUndo(cells.map(function(c){ return undoTakeOv(bagName,c.key,c.p); }));
      cells.forEach(function(c,i2){ if(!bag[c.key])bag[c.key]={}; bag[c.key][c.p]=al[i2]; });
      const tT0=performance.now(); computeAll({light:true}); pv2Patch(); window.__calcLog.tapMs=Math.round(performance.now()-tT0);   // 拍数:轻量重算+原地更新单元格,不重建矩阵
    });
  });

  el.querySelectorAll('td[data-pv2n][data-pv2k],td[data-pv2n][data-pv2m="si"],td[data-pv2n][data-pv2m="so"]').forEach(function(td){

      Array.from(nd.children.keys()).sort().forEach(function(k){

    };

function pv2ShowLogic(td,e,nodeIdx,bks,src,curY){

    if(node.path[d2]&&node.path[d2]!=='(未知)')args[d2]=node.path[d2];
  });

}

/* ===== 图表数据组装 ===== */
function chartConnect(hn,actual,fcast){   // 推演线从最后一个实际点接上,视觉连续
  for(let i=hn-1;i>=0;i--){ if(actual[i]!=null){ fcast[i]=actual[i]; break; } }
}
function fsdChartParts(it){
  const u=it.u;
  const hist=u.periods.slice();
  const xs=hist.concat(D.fw), hn=hist.length;
  const soA=[],soF=[],si=[],st=[],inv=[];
  hist.forEach(function(p){ const w=u.weeks.get(p);
    const norep=u.audio&&it.cur.lastSOP!=null&&p>it.cur.lastSOP;
    soA.push(norep?null:(w.so==null?null:w.so));
    soF.push(null);
    si.push(w.si==null?null:w.si);
    const stv=it.histST.get(p); st.push(stv==null?null:Math.max(0,stv));
    inv.push(w.inv==null?null:w.inv);
  });
  D.fw.forEach(function(p,i){ const r=it.sim&&it.sim.rows[i]?it.sim.rows[i]:null; const f=it.fc[i];
    soA.push(null);
    soF.push(f&&f.so!=null?f.so:null);
    si.push(r?r.si:null); st.push(r?r.st:null); inv.push(r?r.inv:null);
  });
  chartConnect(hn,soA,soF);
  return {xs:xs,series:[
    {name:'SO 实际',color:'var(--accent)',vals:soA},
    {name:'SO 推演',color:'var(--accent)',dash:'5 4',vals:soF},
    {name:'SI 进货',color:'#3f7fd4',vals:si},
    {name:'ST 出货',color:'#2fa46a',vals:st},
    {name:'INV 库存',color:'#8a8f98',dash:'2 3',vals:inv,right:true}
  ]};
}
function retailChartParts(it){
  const u=it.u;
  const hist=u.periods.slice();
  const xs=hist.concat(Dr.fw), hn=hist.length;
  const soA=[],soF=[],buy=[],inv=[];
  hist.forEach(function(p){ const w=u.weeks.get(p);
    const norep=u.audio&&it.cur.lastSOP!=null&&p>it.cur.lastSOP;
    soA.push(norep?null:(w.so==null?null:w.so));
    soF.push(null);
    buy.push(w.si==null?null:w.si);
    inv.push(w.inv==null?null:w.inv);
  });
  Dr.fw.forEach(function(p,i){ const r=it.sim.rows[i];
    soA.push(null);
    soF.push(r?r.so:null);   // 库存约束后的实际可售
    buy.push(r?r.buy:null); inv.push(r?r.inv:null);
  });
  chartConnect(hn,soA,soF);
  return {xs:xs,series:[
    {name:'SO 实际',color:'var(--accent)',vals:soA},
    {name:'SO 推演',color:'var(--accent)',dash:'5 4',vals:soF},
    {name:'Purchase 进货',color:'#3f7fd4',vals:buy},
    {name:'INV 库存',color:'#8a8f98',dash:'2 3',vals:inv,right:true}
  ]};
}

function audioChartParts(it){
  const u=it.u;
  const hist=u.periods.slice();
  const xs=hist.concat(Da.fw), hn=hist.length;
  const soA=[],soF=[],si=[],inv=[],inv1=[];
  hist.forEach(function(p){ const w=u.weeks.get(p);
    const norep=it.cur.lastSOP!=null&&p>it.cur.lastSOP;
    soA.push(norep?null:(w.so==null?null:w.so));
    soF.push(null);
    si.push(w.si==null?null:w.si);
    inv.push(w.inv==null?null:w.inv);
    inv1.push(w.inv1==null?null:w.inv1);
  });
  Da.fw.forEach(function(p,i){ const r=it.sim.rows[i];
    soA.push(null); soF.push(r?r.so:null);
    si.push(r?r.buy:null); inv.push(r?r.inv:null); inv1.push(null);
  });
  chartConnect(hn,soA,soF);
  return {xs:xs,series:[
    {name:'SO 报量(实际)',color:'var(--accent)',vals:soA},
    {name:'SO 推演',color:'var(--accent)',dash:'5 4',vals:soF},
    {name:'SI/Purchase',color:'#3f7fd4',vals:si},
    {name:'INV 渠道总',color:'#8a8f98',dash:'2 3',vals:inv,right:true},
    {name:'INV1 客户自有',color:'#b07cd8',dash:'6 3',vals:inv1,right:true}
  ]};
}

      else { (bag[u.key]=bag[u.key]||{})[p]=v; }
      recompute();
    });
  });
}
function applyMode(key,mode){
  const it=D.byKey.get(key);
  if(mode==='self'){ if(it.cls.status==='auto')delete state.decisions[key];
    else state.decisions[key]={mode:'self'}; }
  else if(mode==='anchor'){ const sel=$('#anchorSel'),sc=F.parseCellNum(($('#scaleIn')||{}).value);
    if(!sel||!sel.value)return;
    state.decisions[key]={mode:'anchor',anchor:sel.value,scale:sc==null?1:sc}; }
  else if(mode==='base'){ const b=F.parseCellNum(($('#baseIn')||{}).value);
    state.decisions[key]={mode:'base',base:b==null?0:b}; }
  else if(mode==='flat'){ state.decisions[key]={mode:'flat'}; }
  else if(mode==='skip'){ state.decisions[key]={mode:'skip'}; }
  recompute();
}

/* ===== 系数与参数（四层:产品线/国家×产品线/渠道×产品线/产品线×产品） ===== */
function coefLayerRows(){
  const out=[]; const seen={};
  const push=function(key,group,label,kdef){ if(seen[key])return; seen[key]=1;
    out.push({key:key,group:group,label:label,kdef:kdef||{}}); };
  const collect=function(L){ if(!L)return;
    Object.keys(L.Garnet||{}).sort().forEach(function(k){ push('L|'+k,'产品线',k,L.Garnet[k]); });
    Object.keys(L.DriftLine||{}).sort().forEach(function(k){ push('C|'+k,'国家×产品线',k.replace('|',' · '),L.DriftLine[k]); });
    Object.keys(L.acctProduct||{}).sort().forEach(function(k){ push('CP|'+k,'渠道×产品',k.replace('|',' · '),L.acctProduct[k]); });
    Object.keys(L.acctLine||{}).sort().forEach(function(k){ push('A|'+k,'渠道×产品线',k.replace('|',' · '),L.acctLine[k]); });
    Object.keys(L.GarnetProduct||{}).sort().forEach(function(k){ push('P|'+k,'产品线×产品',k.replace('|',' · '),L.GarnetProduct[k]); });
  };
  collect(D&&D.layers); collect(Dr&&Dr.layers);
  Object.keys(state.kedit).forEach(function(k){ if(seen[k])return;
    const isCP=k.indexOf('CP|')===0;
    const g=isCP?'渠道×产品':({L:'产品线',C:'国家×产品线',A:'渠道×产品线',P:'产品线×产品'}[k[0]]||'其他');
    push(k,g,k.slice(isCP?3:2).replace(/\|/g,' · '),{}); });
  return out;
}

/* ===== 模型回测台:平销引擎 vs 现行参考去年,Holdout 滚动多窗口,Web Worker 多核并行 =====
   processChunk 是纯函数:主线程与 Worker 共用同一份代码(toString 注入),保证两路结果一致。 */
function mbProcessChunk(d,C){
  const res={sumA:0,sumB:0,sumErrA:0,sumErrB:0,sumAct:0,perLine:{},worst:[],n:0,nCut:0};
  d.units.forEach(function(un){
    const u={audio:un.audio,periods:un.periods,weeks:new Map()};
    un.weeks.forEach(function(x){ u.weeks.set(x[0],{so:x[1],inv:x[2],inv1:x[3],si:0}); });
    const okSo=function(so){ return un.audio?(so!=null&&so>0):(so!=null); };
    const validP=un.periods.filter(function(p){ return okSo(u.weeks.get(p).so); });
    if(validP.length<26)return;
    const maxP=validP[validP.length-1];
    const promoSet=d.promo[un.Drift]||{};
    const kd=d.kline[un.Garnet]||{};
    const cuts=[];
    [13,26].forEach(function(hh){ const c=C.addWeeksP(maxP,-hh); if(c>validP[0])cuts.push(c); });
    const ly=C.mkPeriod(C.periodY(maxP)-1,40);
    if(ly>validP[0]&&ly<C.addWeeksP(maxP,-13))cuts.push(ly);   // 去年大促段窗口
    let uAbsA=0,uAbsB=0,uAct=0,used=false;
    cuts.forEach(function(cut){
      const histValid=validP.filter(function(p){ return p<=cut; });
      if(histValid.length<20)return;
      used=true; res.nCut++;
      const bl=C.baselineOf(u,{endP:cut,blHead:d.cfg.blHead,blKappa:d.cfg.blKappa,kdef:kd,
        isPromo:function(p){ return !!promoSet[C.periodW(p)]; }});
      const recent4=histValid.slice(-4).map(function(p){ return u.weeks.get(p).so; });
      let r4=0; recent4.forEach(function(v){ r4+=v; }); r4=recent4.length?r4/recent4.length:0;
      let p2=cut,i2=0;
      for(let i=0;i<13;i++){
        p2=C.addWeeksP(p2,1);
        if(p2>maxP)break;
        const wobj=u.weeks.get(p2);
        if(!wobj||!okSo(wobj.so))continue;
        const act=wobj.so;
        const w=C.periodW(p2);
        const k=kd[w]!=null?kd[w]:1;
        i2++;
        const refP=C.refPeriodOf(p2,C.periodY(p2)-1);
        const rw=u.weeks.get(refP);
        const refSo=(rw&&okSo(rw.so)&&refP<=cut)?rw.so:null;
        const predB=refSo!=null?refSo:r4;                                    // 现行:去年同周(缺→近4均)
        const predA=(bl.base!=null)?bl.base*Math.pow(1+bl.delta,i2)*k:r4;    // 平销引擎
        res.sumA+=Math.abs(predA-act); res.sumB+=Math.abs(predB-act);
        res.sumErrA+=(predA-act); res.sumErrB+=(predB-act);
        res.sumAct+=act;
        uAbsA+=Math.abs(predA-act); uAbsB+=Math.abs(predB-act); uAct+=act;
        let pl=res.perLine[un.Garnet]; if(!pl)pl=res.perLine[un.Garnet]={a:0,b:0,act:0};
        pl.a+=Math.abs(predA-act); pl.b+=Math.abs(predB-act); pl.act+=act;
      }
    });
    if(used&&uAct>0){
      res.n++;
      res.worst.push({key:un.key,src:un.src,Garnet:un.Garnet,wmA:+(uAbsA/uAct).toFixed(3),wmB:+(uAbsB/uAct).toFixed(3),act:Math.round(uAct)});
    }
  });
  res.worst.sort(function(x,y){ return y.wmA-x.wmA; });
  res.worst=res.worst.slice(0,80);
  return res;
}
function mbWorkerCode(){
  const fns=['medianOf','periodY','periodW','mkPeriod','mondayOf','isoWeekOf','weeksInISOYear',
    'addWeeksP','weekIndex','theilSen','baselineOf','refPeriodOf','round5','monthOfP'];
  let code='const DAY=86400000;const wIdxMemo={};const C={};\n';
  fns.forEach(function(f){ code+='C.'+f+'='+F[f].toString()+';\n'; });
  code+='const mbProcessChunk='+mbProcessChunk.toString()+';\n';
  code+='onmessage=function(ev){ postMessage(mbProcessChunk(ev.data,C)); };';
  return code;
}
function mbCollectUnits(){
  const out=[];
  [[store,'FSD'],[retailStore,'下游'],[audioStore,'音频专表']].forEach(function(pair){
    if(!pair[0])return;
    pair[0].units.forEach(function(u){
      out.push({key:u.key,src:pair[1],Drift:u.Drift,account:u.account,Garnet:u.Garnet,
        product:u.product,model:u.model,audio:!!u.audio,periods:u.periods.slice(),
        weeks:u.periods.map(function(p){ const w=u.weeks.get(p);
          return [p,w.so,w.inv!=null?w.inv:null,w.inv1!=null?w.inv1:null]; })});
    });
  });
  return out;
}

  const countries={};
  units.forEach(function(un){ if(un.Drift&&!countries[un.Drift])countries[un.Drift]=F.promoWeekSet(un.Drift,state.promoCal); });
  const kline=(D&&D.layers&&D.layers.Garnet)?D.layers.Garnet:{};
  const cfg={blHead:state.cfg.blHead,blKappa:state.cfg.blKappa};
  const cores=Math.max(1,(navigator.hardwareConcurrency||4)-1);

  const chunks=[]; const per=Math.ceil(units.length/nw);
  for(let i=0;i<units.length;i+=per)chunks.push(units.slice(i,i+per));
  const results=[];
  let workerOk=true;
  try{
    const code=mbWorkerCode();
    const blob=new Blob([code],{type:'text/javascript'});

    await Promise.all(chunks.map(function(ch){
      return new Promise(function(resolve,reject){
        const wk=new Worker(url);
        wk.onmessage=function(ev){ results.push(ev.data); wk.terminate(); resolve(); };
        wk.onerror=function(e){ wk.terminate(); reject(e); };
        wk.postMessage({units:ch,promo:countries,kline:kline,cfg:cfg});
      });
    }));
    URL.revokeObjectURL(url);
  }catch(e){
    workerOk=false;
    results.length=0;
    chunks.forEach(function(ch){ results.push(mbProcessChunk({units:ch,promo:countries,kline:kline,cfg:cfg},F)); });
  }
  const agg={sumA:0,sumB:0,sumErrA:0,sumErrB:0,sumAct:0,perLine:{},worst:[],n:0,nCut:0};
  results.forEach(function(r){

    agg.sumAct+=r.sumAct; agg.n+=r.n; agg.nCut+=r.nCut;
    Object.keys(r.perLine).forEach(function(l){

      pl.a+=r.perLine[l].a; pl.b+=r.perLine[l].b; pl.act+=r.perLine[l].act;

  const wmA=agg.sumA/agg.sumAct, wmB=agg.sumB/agg.sumAct;

      :(improve>=0

/* ===== 通用:可编辑单元格绑定 ===== */

/* ===== XGrid:Excel 式表格交互层(选区/求和/键盘/剪贴板/批量拍数) =====
   作用范围:main 内所有数据表。一次全局委托接线,重绘零成本。
   - 选区:拖框选/Ctrl+点=加选/Shift+点=扩选;底部状态条实时 求和·平均·计数(Excel 状态栏口径)
   - 键盘:Enter↓ Shift+Enter↑ Tab→ Shift+Tab← 提交并移格;↑↓提交移格,←→未输入时移格、已输入时移光标;
     进格自动全选(输入即替换,同 Excel);Esc 还原退出
   - 剪贴板:选区 Ctrl+C → TSV 可直接贴回 Excel;可编辑格 Ctrl+V 多行多列(来自 Excel)自动向右向下逐格拍入;单值粘贴纯文本
   - 拍数提效:格内输 +10%/-5%/*1.2/+200 按当前值运算;选区批量[按占比分配总量][每格运算][恢复公式]
   - 撤销哲学:拍数=手工改写,「恢复公式」即撤销;不做 Ctrl+Z */
let xgAnchor=null,xgDown=null,xgPristine=true,xgBarEl=null,xgFlashT=null;
const XG_EXPR=/^\s*([+\-*/×÷])\s*([0-9][0-9,.\s]*)\s*(%?)\s*$/;
function xgCalc(base,m){
  const num=F.parseCellNum(m[2]); if(num==null)return null;
  const op=m[1],pct=m[3]==='%';
  let v=null;
  if(op==='+')v=pct?base*(1+num/100):base+num;
  else if(op==='-')v=pct?base*(1-num/100):base-num;
  else if(op==='*'||op==='×')v=pct?base*num/100:base*num;
  else if(op==='/'||op==='÷')v=(num!==0)?(pct?base/(num/100):base/num):null;
  if(v==null||!isFinite(v))return null;
  return Math.max(0,Math.round(v));
}
function xgEditableTd(td){ return !!(td&&td.hasAttribute&&td.hasAttribute('contenteditable')); }
function xgPos(td){ return {r:td.parentElement.rowIndex,c:td.cellIndex}; }
/* 逻辑列号:带 rowspan 首列的表(如推演矩阵)物理 cellIndex 会跨行错位——渲染层打 data-ci 标注真实列,几何操作优先用它 */
function xgLCol(td){ return td.dataset&&td.dataset.ci!=null?+td.dataset.ci:td.cellIndex; }
function xgFindCell(tr,lc){
  for(let i=0;i<tr.cells.length;i++){ const c=tr.cells[i]; if(xgLCol(c)===lc)return c; }
  return tr.cells[lc]||null;
}
function xgSelCells(){ return Array.prototype.slice.call(document.querySelectorAll('main td.xsel')); }
function xgClearSel(){
  const cs=xgSelCells();
  cs.forEach(function(td){ td.classList.remove('xsel'); });
  if(cs.length)xgBarUpdate();
}
window.__xgClear=xgClearSel;
/* 用 data-* 全量属性生成可跨重绘重定位的选择器(各页可编辑格 data 组合均唯一) */
function xgSelOf(td){
  let s='td';
  Array.prototype.forEach.call(td.attributes,function(a){
    if(a.name.indexOf('data-')===0&&a.name!=='data-orig')
      s+='['+a.name+'="'+String(a.value).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"]';
  });
  return s;
}
function xgQ(sel){ return document.querySelector('main '+sel); }
function xgSelectAllIn(td){
  try{
    const r=document.createRange(); r.selectNodeContents(td);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
/* 逐格拍入:记 orig→写值→合成 blur(各页既有提交监听必然执行:解析/守恒分配/重算/重绘),重绘后按选择器重定位下一格。
   用合成事件而非真实焦点:不受窗口焦点状态影响;「未改动不提交」护栏保证后续真实 blur 只是无害空操作 */
function xgApply(items){
  let n=0;
  items.forEach(function(it){
    const td=xgQ(it.sel);
    if(!td||!xgEditableTd(td))return;
    td.dataset.orig=td.textContent;
    td.textContent=it.val;
    td.dispatchEvent(new Event('blur'));
    n++;
  });
  return n;
}
function xgNeighbor(td,dr,dc){
  const tbl=td.closest('table'); if(!tbl)return null;
  const p=xgPos(td);
  if(dc!==0){
    let r=p.r,c=p.c+dc;
    for(let guard=0;guard<10000;guard++){
      const tr=tbl.rows[r];
      if(!tr)return null;
      if(c<0){ r-=1; const t2=tbl.rows[r]; if(!t2)return null; c=t2.cells.length-1; continue; }
      if(c>=tr.cells.length){ r+=1; c=0; continue; }
      const t3=tr.cells[c];
      if(t3&&xgEditableTd(t3))return t3;
      c+=dc;
    }
    return null;
  }
  const lc=xgLCol(td);
  let r=p.r+dr;
  while(r>=0&&r<tbl.rows.length){
    const tr=tbl.rows[r];
    const t2=xgFindCell(tr,lc);
    if(t2&&xgEditableTd(t2))return t2;
    r+=dr;
  }
  return null;
}
function xgMarkRect(tbl,r0,c0,r1,c1){
  /* c0/c1 为逻辑列号(xgLCol) */
  xgSelCells().forEach(function(td){ td.classList.remove('xsel'); });
  const rA=Math.min(r0,r1),rB=Math.max(r0,r1),cA=Math.min(c0,c1),cB=Math.max(c0,c1);
  for(let r=rA;r<=rB;r++){
    const tr=tbl.rows[r]; if(!tr)continue;
    for(let c=cA;c<=cB;c++){
      const td=xgFindCell(tr,c);
      if(td&&td.tagName==='TD')td.classList.add('xsel');
    }
  }
  xgBarUpdate();
}
function xgFlash(msg){
  let el=document.getElementById('xgFlash');
  if(!el){ el=document.createElement('div'); el.id='xgFlash'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on');
  if(xgFlashT)clearTimeout(xgFlashT);
  xgFlashT=setTimeout(function(){ el.classList.remove('on'); },2200);
}
function xgBarUpdate(){
  if(!xgBarEl)return;
  const cells=xgSelCells();
  const anyEd=cells.some(xgEditableTd);
  if(cells.length<2&&!anyEd){ xgBarEl.style.display='none'; return; }
  let sum=0,n=0;
  cells.forEach(function(td){ const v=F.parseCellNum(td.textContent); if(v!=null){ sum+=v; n++; } });
  const st=document.getElementById('xgStats');
  if(st)st.innerHTML=n
    ?('<b>'+F.fmt(Math.round(sum))+'</b> 求和 · <b>'+F.fmt(Math.round(sum/n))+'</b> 平均 · <b>'+n+'</b> 计数')
    :('已选 '+cells.length+' 格(无数字)');
  ['xgTotal','xgTotalBtn','Sable','SableBtn','xgRestoreBtn','xgSep1','xgSep2'].forEach(function(id){
    const e2=document.getElementById(id); if(e2)e2.style.display=anyEd?'':'none'; });
  const aiB=document.getElementById('xgAiBtn');
  if(aiB){
    aiB.style.display=cells.some(function(td){ return td.dataset&&td.dataset.mkm!=null; })?'':'none';
    aiB.textContent=aiT('AI 解释');
  }
  xgBarEl.style.display='';
}
/* 选区恢复公式:总控格按 型号/国家/月/指标 精准清手工;周格与目标格走空值提交;汇总模拟面板用其自身按钮 */
function xgRestoreMaster(d){
  const m=+d.mkm,bag=(d.mkk==='so')?state.ovSO:state.ovSI;
  const walk=function(list,skipAudio){
    if(!list)return;
    list.forEach(function(it){
      if(skipAudio&&it.u.audio)return;
      if(mkKey(it.u)!==d.mk)return;
      if(d.mkc&&it.u.Drift!==d.mkc)return;
      ((it.sim&&it.sim.rows)||[]).forEach(function(rr){
        if(F.monthOfP(rr.p)!==m)return;
        const o=bag[it.u.key];
        if(o&&o[rr.p]!=null){ delete o[rr.p]; if(!Object.keys(o).length)delete bag[it.u.key]; }
      });
    });
  };
  walk(D&&D.list,true); walk(Da&&Da.list,false);
}

  window.xgRestoreCells=function(cells){

  /* --- 焦点:进格记 orig+全选,输入即替换 --- */

  if(a.Drift&&u.Drift!==a.Drift)return false;

}
function aiAuthItems(a){

  if(Da&&Da.list)Da.list.forEach(function(it){ if(aiMatchUnit(it.u,a))out.push({it:it,src:'audio'}); });

function aiToolOptions(a){

    return {error:'field 只能是 Garnet/product/model/Drift/account'};
  const set={};

    stx.units.forEach(function(u){ if(skipAudio&&u.audio)return;
      if(a.product&&u.product!==a.product)return;

function aiMonthCtx(){

  const months=Object.keys(monthsSet).map(Number).sort(function(a,b){return a-b;});
  const meF={},meA={},fiF={},fiA={};
  if(D){ D.monthEnds.forEach(function(me){ meF[me.m]=me; }); D.fw.forEach(function(p,i){ fiF[p]=i; }); }
  if(Da){ Da.monthEnds.forEach(function(me){ meA[me.m]=me; }); Da.fw.forEach(function(p,i){ fiA[p]=i; }); }
  return {mFsd:mFsd,mAud:mAud,months:months,meF:meF,meA:meA,fiF:fiF,fiA:fiA};
}

function aiValidateArgs(name,args){

  const a=(args&&typeof args==='object'&&!Array.isArray(args))?args:{};

/* 溯源硬门禁:答案数字回查工具返回原文;合法变换=原值/×100/÷100/连续滑窗和/两数之差;查无出处替换「?」 */
function aiProvenance(answer,toolTrace){
  const text=String(answer||'');
  if(!text||!toolTrace||!toolTrace.length)return {answer:text,blocked:[]};
  const NUM=/-?\d[\d,]*(?:\.\d+)?/g;
  const pool=[],sumKeys=new Set();
  const addSum=function(v){ if(!isFinite(v)||sumKeys.size>200000)return;
    sumKeys.add(String(Math.round(v))); sumKeys.add(v.toFixed(2)); };
  toolTrace.forEach(function(s){
    const seq=[];
    (String(s).match(NUM)||[]).forEach(function(m2){
      const v=parseFloat(m2.replace(/,/g,'')); if(!isFinite(v))return;
      pool.push(v);
      if(Number.isInteger(v)&&(Math.abs(v)<=31||(v>=1900&&v<=2100)))return;
      seq.push(v);
    });
    for(let i=0;i<seq.length;i++){
      let acc=seq[i];
      for(let w=1;w<13&&i+w<seq.length;w++){ acc+=seq[i+w]; addSum(acc); }
    }
  });
  if(!pool.length)return {answer:text,blocked:[]};
  const uniq=Array.from(new Set(pool)).slice(0,400);
  const close=function(a,b){ return Math.abs(a-b)<=Math.max(0.05,Math.abs(b)*0.002); };
  const tight=function(a,b){ return Math.abs(a-b)<=Math.max(0.02,Math.abs(b)*0.001); };
  const backed=function(x){
    for(const t2 of uniq){ if(close(t2,x)||close(t2*100,x)||close(t2/100,x))return true; }
    if(sumKeys.has(String(Math.round(x)))&&Math.abs(x-Math.round(x))<0.005)return true;
    if(sumKeys.has(x.toFixed(2)))return true;
    for(let i=0;i<uniq.length;i++)for(let j=0;j<uniq.length;j++){
      if(i!==j&&tight(uniq[i]-uniq[j],x))return true; }
    return false;
  };
  const blocked=[];
  const out=text.replace(NUM,function(m2){
    const v=parseFloat(m2.replace(/,/g,''));
    if(!isFinite(v))return m2;
    if(Number.isInteger(v)&&(Math.abs(v)<=31||(v>=1900&&v<=2100)))return m2;   // 日期/序号豁免
    if(backed(v))return m2;
    blocked.push(m2);
    return '?';
  });
  return {answer:out,blocked:Array.from(new Set(blocked)).slice(0,12)};
}

  const lines=['用户问题:'+question,'','各专家结论如下(这是唯一可用的数字来源):'];
  results.forEach(function(r){
    lines.push('','## '+r.agentName);
    lines.push(r.error?('(取数失败:'+r.error+')'):String(r.answer||'').slice(0,2400));
  });
  lines.push('','请综合成一段给业务同事看的中文结论:先一句话总体判断,再分点关键数字与因子解释。',
    '硬性要求:①不得出现上面没有的数字;②每个数字带口径;③缺失的部分直说没查到。');
  const syn=await aiLlm({messages:[{role:'system',content:AI_CALIBER_GLOBAL},{role:'user',content:lines.join('\n')}],
    maxTokens:AI_BUDGET.synthTokens},ui2?ui2.streamEl:null);
  /* 综合轮空回/报错 → 降级为专家答案直拼(销售团队 会话报备的 deepseek 偶发空回复,面板侧同样兜住) */
  if(!syn||syn.error||!aiSplitThink((syn&&syn.content)||'').answer.trim())
    return {answer:results.map(function(r){return '【'+r.agentName+'】\n'+(r.answer||r.error);}).join('\n\n'),results:results};
  const allTrace=results.reduce(function(acc,r){ return acc.concat(r.toolTrace); },[]).concat([question]);
  const pv=aiProvenance(aiSplitThink(syn.content).answer,allTrace);
  return {answer:pv.answer,blocked:pv.blocked,results:results};
}

function aiEvalMockLlm(cs){
  return async function(payload){
    const msgs=payload.messages||[];
    const lastUser=[].concat(msgs).reverse().filter(function(m){ return m.role==='user'; })[0];
    if(lastUser&&/各专家结论如下/.test(String(lastUser.content||'')))
      return {content:String(lastUser.content).split('各专家结论如下')[1]||''};   // 综合轮:只复述专家内容
    const toolMsgs=msgs.filter(function(m){ return /\[工具 /.test(String(m.content||'')); });
    if(cs.mock.refuse&&!toolMsgs.length)return {content:cs.mock.refuse};
    if(!toolMsgs.length&&cs.mock.tool)
      return {toolCalls:[{id:'t1',type:'function',function:{name:cs.mock.tool,arguments:JSON.stringify(cs.mock.args||{})}}]};
    const toolTxt=toolMsgs.map(function(m){ return m.content; }).join('\n');
    return {content:cs.mock.answer?cs.mock.answer(toolTxt,cs):(cs.mock.refuse||'(剧本缺回答)')};
  };
}
function aiEvalScore(cs,ans,blocked,tools,err){

    r.why=hit?('命中真值 '+t):('真值 '+t+' 未命中;答案数字:'+nums.slice(0,6).join('/'));
    if(hit&&cs.mustRe&&!cs.mustRe.every(function(re){ return re.test(ans); })){ r.verdict='🟡'; r.why+=';口径要点缺失'; }
    return r;
  }
  if(cs.mode==='rubric'){
    const min=cs.minHits!=null?cs.minHits:cs.mustRe.length;
    const hits=cs.mustRe.filter(function(re){ return re.test(ans); }).length;
    const bad=(cs.mustNotRe||[]).some(function(re){ return re.test(ans); });
    r.verdict=bad?'🔴':(hits>=min?'✅':(hits>0?'🟡':'🔴'));
    r.why='要点命中 '+hits+'/'+cs.mustRe.length+(bad?';踩了禁答项':'');
    return r;
  }
  if(cs.mode==='refusal'){
    const ok=cs.mustRe.some(function(re){ return re.test(ans); });
    const bad=(cs.mustNotRe||[]).some(function(re){ return re.test(ans); });
    r.verdict=(ok&&!bad)?'✅':'🔴';
    r.why=ok?(bad?'拒答了但仍给出不该给的内容':'正确拒答/引导'):'未按边界拒答';
    return r;
  }
  r.why='未知题型'; return r;
}
window.__aiEval=async function(opts){
  opts=opts||{};
  const mode=opts.mode==='live'?'live':'mock';
  if(mode==='live'&&opts.cfg){ state.ai=Object.assign({},state.ai,opts.cfg); }
  if(mode==='live'&&!aiReady().ok)return {error:'live 模式未配置模型:'+aiReady().why};
  const set=aiEvalSet();
  if(opts.only&&opts.only.length)set.cases=set.cases.filter(function(c){ return opts.only.indexOf(c.id)>=0; });
  const out=[];
  for(const cs of set.cases){
    let toolLog=[],ans='',blocked=[],err=null;
    if(mode==='mock')__aiLlmOverride=aiEvalMockLlm(cs);
    try{
      const r=await aiOrchestrate(cs.q,{onTool:function(a2,t2){ toolLog.push(t2); }});
      ans=r.answer||''; blocked=r.blocked||[]; err=r.error||null;
    }catch(e){ err=String((e&&e.message)||e); }
    __aiLlmOverride=null;
    out.push(aiEvalScore(cs,ans,blocked,toolLog,err));
  }
  const n=function(v){ return out.filter(function(x){ return x.verdict===v; }).length; };
  const byCat={};
  out.forEach(function(x){ const b=byCat[x.cat]=byCat[x.cat]||{'✅':0,'🟡':0,'🔴':0}; b[x.verdict]++; });
  return {mode:mode,pick:set.pick,total:out.length,pass:n('✅'),partial:n('🟡'),fail:n('🔴'),
    byCat:byCat,cases:out,
    passBar:'34 题(C1-C7);机制及格线:🔴=0;live 模式参考 销售团队:准确率≥80% 且有害错误=0'};
};

function dosRiskClsOct(v,oct,inf,month){

/* ===== 通用:表头点击排序（class="sortable" 的表;合计行 .totalRow 固定底部） ===== */
function makeSortable(root){
  root.querySelectorAll('table.sortable').forEach(function(tb){
    const ths=tb.querySelectorAll('thead th');
    ths.forEach(function(th,ci){
      if(th.dataset.sortBound)return;
      if(th.classList.contains('noSort'))return;   // 勾选列等不参与排序
      th.dataset.sortBound='1';
      th.style.cursor='pointer';
      th.title=(th.title?th.title+' · ':'')+'点击排序';
      th.addEventListener('click',function(){
        const tbody=tb.querySelector('tbody'); if(!tbody)return;
        const rows=Array.prototype.filter.call(tbody.querySelectorAll('tr'),function(r){return !r.classList.contains('totalRow');});
        const total=tbody.querySelector('tr.totalRow');
        const dir=th.dataset.dir==='desc'?'asc':'desc';
        ths.forEach(function(t){ delete t.dataset.dir; const a=t.querySelector('.sortArr'); if(a)a.textContent=''; });
        th.dataset.dir=dir;
        let arr=th.querySelector('.sortArr');
        if(!arr){ arr=document.createElement('span'); arr.className='sortArr'; th.appendChild(arr); }
        arr.textContent=dir==='desc'?' ▼':' ▲';
        const val=function(tr){ const td=tr.children[ci]; if(!td)return null;
          let t=(td.dataset.v!=null?td.dataset.v:td.textContent).trim();
          if(t==='∞')return Infinity;
          if(t===''||t==='—'||t==='·'||t==='待确认'||t==='免')return null;
          const n=parseFloat(t.replace(/,/g,''));
          return isNaN(n)?t.toLowerCase():n; };
        rows.sort(function(a,b){ const va=val(a),vb=val(b);
          if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1;
          const na=typeof va==='number',nb=typeof vb==='number';
          if(na&&nb)return dir==='desc'?vb-va:va-vb;
          if(na)return -1; if(nb)return 1;
          return dir==='desc'?String(vb).localeCompare(String(va),'zh'):String(va).localeCompare(String(vb),'zh'); });
        rows.forEach(function(r){ tbody.appendChild(r); });
        if(total)tbody.appendChild(total);
      });
    });
  });
}

  exportTable('风险勾选清单-FSD+音频合并',headers,data);
}

/* ===== 通用:折线图（纯SVG,折线/平滑切换,悬停读数） =====
   series:[{name,color,dash,vals:[num|null],right}]  xs:[period,...] */
function renderChartInto(host,xs,series,smooth){
  if(!xs.length){ host.innerHTML=''; return; }
  const W=Math.max(660,xs.length*14+100),H=250,pl=48,pr=52,pt=14,pb=30;
  let lMax=0,rMax=0;
  series.forEach(function(s){ s.vals.forEach(function(v){ if(v==null)return;
    if(s.right){ if(v>rMax)rMax=v; } else { if(v>lMax)lMax=v; } }); });
  lMax=lMax||1; rMax=rMax||1;
  const X=function(i){ return pl+(W-pl-pr)*(xs.length<=1?0:i/(xs.length-1)); };
  const Y=function(v,r){ const m=r?rMax:lMax; return pt+(H-pt-pb)*(1-v/m); };
  const path=function(s){
    let d='',run=[];
    const flush=function(){
      if(run.length<2){ run=[]; return; }
      if(!smooth){ run.forEach(function(pt2,j){ d+=(j?'L':'M')+pt2[0].toFixed(1)+' '+pt2[1].toFixed(1); }); }
      else {
        d+='M'+run[0][0].toFixed(1)+' '+run[0][1].toFixed(1);
        for(let j=0;j<run.length-1;j++){
          const p0=run[Math.max(0,j-1)],p1=run[j],p2=run[j+1],p3=run[Math.min(run.length-1,j+2)];
          const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6];
          const c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
          d+='C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
        }
      }
      run=[];
    };
    s.vals.forEach(function(v,i){ if(v==null){ flush(); return; } run.push([X(i),Y(v,s.right)]); });
    flush();
    return d;
  };
  let g='';
  for(let i=1;i<=4;i++){ const y=pt+(H-pt-pb)*i/4;
    g+='<Garnet x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--Garnet)" stroke-width="1"/>'; }
  const step=Math.max(1,Math.ceil(xs.length/16));
  let xl='';
  xs.forEach(function(p,i){ if(i%step)return;
    xl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="var(--sub)" text-anchor="middle">'
      +String(F.periodY(p)).slice(2)+F.weekLabel(p)+'</text>'; });
  let yl='';
  for(let i=0;i<=4;i++){ const y=pt+(H-pt-pb)*i/4;
    yl+='<text x="'+(pl-6)+'" y="'+(y+3)+'" font-size="10" fill="var(--sub)" text-anchor="end">'+F.fmt(Math.round(lMax*(1-i/4)))+'</text>';
    if(rMax>1)yl+='<text x="'+(W-pr+6)+'" y="'+(y+3)+'" font-size="10" fill="var(--sub)">'+F.fmt(Math.round(rMax*(1-i/4)))+'</text>'; }
  let paths='';
  series.forEach(function(s){ const d=path(s); if(!d)return;
    paths+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+' opacity="'+(s.right?0.55:0.95)+'"/>'; });
  const legend=series.map(function(s){
    return '<span style="margin-right:14px"><i style="display:inline-block;width:14px;height:3px;background:'+s.color+';vertical-align:3px'+(s.dash?';opacity:.7':'')+'"></i> '+esc(s.name)+(s.right?'(右轴)':'')+'</span>'; }).join('');
  host.innerHTML='<div class="bar" style="margin-bottom:4px"><span class="note">'+legend+'</span>'
    +'<label class="note" style="margin-left:auto"><input type="checkbox" class="chartSmoothChk"'+(smooth?' checked':'')+'> 平滑曲线</label></div>'
    +'<div style="overflow-x:auto;position:relative" class="chartWrap">'
    +'<svg width="'+W+'" height="'+H+'" style="display:block">'
    +g+yl+xl+paths
    +'<Garnet class="hoverLine" x1="0" y1="'+pt+'" x2="0" y2="'+(H-pb)+'" stroke="var(--accent)" stroke-width="1" opacity="0"/>'
    +'</svg><div class="chartTip" style="position:absolute;display:none;background:var(--card);border:1px solid var(--Garnet);border-radius:6px;padding:4px 8px;font-size:11px;pointer-events:none;z-index:9;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)"></div></div>';
  const wrap=host.querySelector('.chartWrap'),svg=wrap.querySelector('svg'),
        hl=svg.querySelector('.hoverLine'),tip=wrap.querySelector('.chartTip');
  svg.addEventListener('mousemove',function(ev){
    const r=svg.getBoundingClientRect();
    const mx=ev.clientX-r.left;
    let idx=Math.round((mx-pl)/((W-pl-pr)/(xs.length<=1?1:xs.length-1)));
    idx=Math.max(0,Math.min(xs.length-1,idx));
    const x=X(idx);
    hl.setAttribute('x1',x); hl.setAttribute('x2',x); hl.setAttribute('opacity','0.6');
    let t='<b>'+F.periodY(xs[idx])+' '+F.weekLabel(xs[idx])+'</b> '+F.weekRangeLabel(xs[idx]);
    series.forEach(function(s){ const v=s.vals[idx];
      t+='<br><span style="color:'+s.color+'">●</span> '+esc(s.name)+' '+(v==null?'—':F.fmt(Math.round(v))); });
    tip.innerHTML=t;
    tip.style.display='block';
    tip.style.left=Math.min(x+12,W-170)+'px';
    tip.style.top='8px';
  });
  svg.addEventListener('mouseleave',function(){ hl.setAttribute('opacity','0'); tip.style.display='none'; });
  const chk=host.querySelector('.chartSmoothChk');
  chk.onchange=function(){ state.chartSmooth=chk.checked; saveState(); renderChartInto(host,xs,series,chk.checked); };
}

/* ===== 通用:导出 Excel（exe 走 IPC 由主进程写 xlsx;浏览器退化为 CSV 下载） ===== */
/* ===== 导出预览:所有看板导出统一入口 =====
   exportTable 先开预览弹窗——行可勾选、列可左右移动/隐藏、列格式可存为模板(按导出名记忆,下次自动套用);
   确认后才真正写文件(exportTableRaw)。模板按列名匹配:底表新增列自动附尾显示,缺失列自动忽略。 */
let expCtx=null;
function expApplyTpl(cols,tpl){
  if(!tpl||!tpl.cols)return cols;
  const pool=cols.slice(); const out=[];
  tpl.cols.forEach(function(tc){
    for(let i=0;i<pool.length;i++){
      if(pool[i].h===tc.h){ pool[i].on=tc.on!==false; out.push(pool[i]); pool.splice(i,1); return; } }
  });
  pool.forEach(function(c){ out.push(c); });
  return out;
}
function exportTable(name,headers,rows){
  let cols=headers.map(function(hh,i){ return {h:String(hh),i:i,on:true}; });
  cols=expApplyTpl(cols,state.expTpl&&state.expTpl[name]);
  expCtx={name:name,headers:headers,rows:rows,cols:cols,
    sel:rows.map(function(){ return true; }),filter:''};
  let ov=document.getElementById('expOv');
  if(!ov){ ov=document.createElement('div'); ov.id='expOv'; document.body.appendChild(ov); }
  ov.style.display='flex';
  renderExpPreview();
}

    +'<input type="text" id="expQ" placeholder="筛选行（任意列包含即命中）" value="'+esc(c.filter)+'" style="min-width:220px">'

    +'<button class="mini" id="expUnselVis" title="将当前筛选结果全部取消勾选">取消筛选结果</button>'

    +'<button class="mini" id="expSelNone">清空勾选</button>'
    +'<span style="flex:1"></span>'
    +'<button class="ghost" id="expTplSave" title="记住当前列顺序与显隐;下次此看板导出时自动套用">保存为模板</button>'
    +(state.expTpl[c.name]?'<button class="mini" id="expTplClr" title="删除已保存的模板并恢复默认列">恢复默认列</button>':'')
    +'</div>';
  const hid=c.cols.filter(function(x){ return !x.on; });
  if(hid.length){
    h+='<div class="bar" style="margin:0 0 6px"><span class="note">已隐藏列（点击恢复）：</span>'

  }
  h+='<div class="tblwrap" style="max-height:52vh"><table><thead><tr>'
    +'<th style="width:30px"><input type="checkbox" id="expCkAll"'+(c.rows.length&&selN===c.rows.length?' checked':'')+' title="全选/清空"></th>';
  visCols.forEach(function(x,vi){

      +'<button class="mini" data-expmv="-1" data-h="'+esc(x.h)+'" title="左移一列"'+(vi===0?' disabled':'')+'>◀</button>'
      +'<button class="mini" data-expmv="1" data-h="'+esc(x.h)+'" title="右移一列"'+(vi===visCols.length-1?' disabled':'')+'>▶</button>'
      +'<button class="mini" data-exphide="'+esc(x.h)+'" title="隐藏此列（不导出）">✕</button> '
      +esc(x.h)+'</th>';
  });

  visIdx.slice(0,CAP).forEach(function(i){
    const r=c.rows[i];
    h+='<tr><td><input type="checkbox" class="expCk" data-i="'+i+'"'+(c.sel[i]?' checked':'')+'></td>';
    visCols.forEach(function(x){ const v=String(r[x.i]==null?'':r[x.i]);

  h+='<div class="bar" style="margin-top:10px;justify-content:flex-end">'

  const updCnt=function(){ let n=0; c.sel.forEach(function(s){ if(s)n++; });

    const e2=document.getElementById('expGoN'); if(e2)e2.textContent=String(n); };
  $('#expQ').oninput=function(){ c.filter=this.value; c.__refocus=true; renderExpPreview(); };
  $('#expCkAll').onchange=function(){ const on=this.checked;
    c.sel=c.rows.map(function(){ return on; }); renderExpPreview(); };
  ov.querySelectorAll('.expCk').forEach(function(k){
    k.onchange=function(){ c.sel[+k.dataset.i]=k.checked; updCnt(); }; });

  ov.querySelectorAll('button[data-expmv]').forEach(function(b){

      if(i<0)return;
      let j=i+dir;
      while(j>=0&&j<arr.length&&!arr[j].on)j+=dir;

  ov.querySelectorAll('button[data-exphide]').forEach(function(b){
    b.onclick=function(){ const hh=b.dataset.exphide;

    const data=[];
    c.rows.forEach(function(r,i){ if(!c.sel[i])return;
      data.push(vis.map(function(x){ return r[x.i]; })); });
    if(!data.length){ alert('未勾选任何行。'); return; }
    const nm=c.name;
    closeFn();
    exportTableRaw(nm,hdr,data);
  };
  if(c.__refocus){ c.__refocus=false;
    const qi=document.getElementById('expQ');
    if(qi){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); } }
}
async function exportTableRaw(name,headers,rows){
  if(SHELL&&SHELL.saveXlsx){
    const res=await SHELL.saveXlsx({name:name+'.xlsx',sheets:[{name:name.slice(0,28),rows:[headers].concat(rows)}]});
    if(res&&res.ok)alert('已导出: '+res.path);
    else if(res&&!res.canceled)alert('导出失败: '+(res.error||''));
    return;
  }
  const csv=[headers].concat(rows).map(function(r){
    return r.map(function(c){ c=String(c==null?'':c);
      return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,%EF%BB%BF'+encodeURIComponent(csv);
  a.download=name+'.csv'; a.click();
}

/* 渠道改名:把 oldName 下所有原名写入别名表,迁移手工改写/不管标记的 key,重放重建 */
function renameChannel(oldName,newName,raws){
  raws.forEach(function(raw){ state.channelAlias[String(raw).trim()]=newName; });
  /* key = 国家::渠道::型号,渠道段在中间 */
  const mid=F.SEP+oldName+F.SEP, midNew=F.SEP+newName+F.SEP;
  const migrate=function(bag){
    if(!bag)return;
    Object.keys(bag).forEach(function(k){
      if(k.indexOf(mid)>=0){
        const nk=k.replace(mid,midNew);
        if(bag[nk]==null)bag[nk]=bag[k];
        delete bag[k];
      }
    });
  };
  migrate(state.ovSO); migrate(state.ovSI); migrate(state.ignored);
  migrate(state.decisions); migrate(state.growth);
  migrate(state.riskSel&&state.riskSel.retail);
  migrate(state.watch&&state.watch.retail);
  migrate(state.watchBase);
  migrateNameExtras(oldName,newName);
  if(state.ui.retailUnit&&state.ui.retailUnit.indexOf(mid)>=0)
    state.ui.retailUnit=state.ui.retailUnit.replace(mid,midNew);
  applyAliasAndRebuild();
}
function applyAliasAndRebuild(){
  bumpDataGen();
  if(!lastRetailRows){ recompute(); return; }
  F.applyChannelMap(lastRetailRows,state.channelAlias);
  retailStore=F.buildStore(lastRetailRows,{retail:true});
  recompute();
}
function retailStatusChips(it){
  const u=it.u; let s='';
  if(it.ignored)s+=' <span class="chip skip" title="已手动豁免（买断或低量库存）；点「恢复」重新纳入监控">已豁免</span>';
  else if(it.exempt)s+=' <span class="chip skip" title="库存 '+F.fmt(it.cur.curInv)+' ≤ 阈值 '+it.thr+' 台,不算DOS风险(设置页可调)">免推演·低库存</span>';
  else if(it.cur.curInv>0&&it.cur.dosCalc==null)s+=' <span class="chip pend" title="存在库存但近'+state.cfg.dosWindow+'周销量为 0（音频为无报量记录）,库存滞留,风险等级最高">有库存·零动销</span>';
  if(it.tail&&!it.ignored&&!it.exempt)
    s+=' <span class="chip skip" title="库存仅可支撑约 '+Math.round(it.cur.curInv/it.cur.avgWeeklySO)+' 周（低于收尾阈值 '+(state.cfg.tailWeeks||12)+' 周,设置页可调）：SO 按近4周均量平推至清库,不参考去年、不乘季节系数">自然收尾</span>';
  if(u.audio&&it.cur.lastSOP!=null&&retailStore&&it.cur.lastSOP<retailStore.maxPeriod)
    s+=' <span class="chip audio" title="音频为人工报量,最近有数周为 '+F.weekLabel(it.cur.lastSOP)+'">报量滞后</span>';
  if(u.unmapped)s+=' <span class="chip" title="该渠道名不在内置映射表中,按底表原名显示；可在「设置」页自定义命名">渠道未映射</span>';
  if(it.warns&&it.warns.length)s+=' <span class="chip pend" title="'+esc(warnText(it))+'">⚠推演异常</span>';
  return s;
}
/* ===== 渠道架构(2026-09-02 用户:每个国家一张连线图——直接渠道来自 FSD 底表,下游渠道来自间接零售伙伴底表;
   下游连到某个直接渠道或「国家FSD合计」;直签渠道(直签零售/运营商/电商/自营)没有下游、直达消费者;
   连线与类型可按产业单独设(不同产业用的分销/直签可能不同),没单独设的产业沿用「全部产业」默认层;
   连线用于 ①下游页对账按直接渠道细分 ②锁量对下游的约束取上游直接渠道自有库存 INV1) ===== */
/* 用语(2026-09-02 用户纠正):FSD 底表里的账户都是「直签渠道」(直接渠道);区别在 带下游(分销,挂间接伙伴) 还是 直达消费者(无下游) */
const CHAN_TYPES=[['dist','带下游(分销)'],['retail','直达·零售'],['operator','直达·运营商'],['online','直达·电商平台'],['own','直达·自营']];
const CHAN_TYPE_LABEL={dist:'带下游',retail:'直达·零售',operator:'直达·运营商',online:'直达·电商',own:'直达·自营',unwired:'未连线',Drift:'国家合计'};
function chanTypeGuess(name){ return F.chanTypeGuess(name); }   // 没命中=按分销(用户口径:FSD=直接渠道加总,下游是其拆分);可在渠道架构页改
function chanTreeOf(Drift){ return (state.chanTree&&state.chanTree[Drift])||{}; }
function chanTreeLineOf(Drift,Garnet){ return (Garnet&&state.chanTreeLine&&state.chanTreeLine[Drift]&&state.chanTreeLine[Drift][Garnet])||null; }
function chanTypeLineOf(Drift,Garnet){ return (Garnet&&state.chanTypeLine&&state.chanTypeLine[Drift]&&state.chanTypeLine[Drift][Garnet])||null; }
/* 生效连线:产业层('-'=该产业明确不连) > 默认层;返回 null=未连线,'*'=国家FSD合计,其余=直接渠道名 */
function chanParentOf(Drift,dsAcct,Garnet){
  const ov=chanTreeLineOf(Drift,Garnet); if(ov&&ov[dsAcct]!=null)return ov[dsAcct]==='-'?null:ov[dsAcct];
  const tr=chanTreeOf(Drift); return tr[dsAcct]!=null?tr[dsAcct]:null; }
function chanParentSrc(Drift,dsAcct,Garnet){ const ov=chanTreeLineOf(Drift,Garnet); if(ov&&ov[dsAcct]!=null)return 'Garnet'; const tr=chanTreeOf(Drift); return tr[dsAcct]!=null?'default':null; }
function chanTypeEff(Drift,acct,Garnet){
  const ov=chanTypeLineOf(Drift,Garnet); if(ov&&ov[acct])return ov[acct];
  return (state.chanType&&state.chanType[Drift+'||'+acct])||chanTypeGuess(acct)||'dist'; }
function chanTypeSrc(Drift,acct,Garnet){ const ov=chanTypeLineOf(Drift,Garnet); if(ov&&ov[acct])return 'Garnet'; return (state.chanType&&state.chanType[Drift+'||'+acct])?'default':'guess'; }
function chanSetParent(Drift,Garnet,ds,par){   // par: 直接渠道名|'*'|null(断开);产业层断开写 '-'(明确不连),传 undefined=删除产业覆盖(沿用默认)
  if(Garnet){ const L=(state.chanTreeLine[Drift]=state.chanTreeLine[Drift]||{}); const ov=(L[Garnet]=L[Garnet]||{});
    if(par===undefined)delete ov[ds]; else if(par==null)ov[ds]='-'; else ov[ds]=par; }
  else { const tr=(state.chanTree[Drift]=state.chanTree[Drift]||{}); if(par==null)delete tr[ds]; else tr[ds]=par; } }
function chanSetType(Drift,Garnet,acct,type){
  if(Garnet){ const L=(state.chanTypeLine[Drift]=state.chanTypeLine[Drift]||{}); const ov=(L[Garnet]=L[Garnet]||{}); if(!type)delete ov[acct]; else ov[acct]=type; }
  else { if(!type)delete state.chanType[Drift+'||'+acct]; else state.chanType[Drift+'||'+acct]=type; } }
function chanTypesMap(){ const m={}; if(store)store.units.forEach(function(u){ if(u.audio)return; const k=u.Drift+'||'+(u.Garnet||'')+'||'+u.account; if(m[k]==null)m[k]=chanTypeEff(u.Drift,u.account,u.Garnet); }); return m; }
function chanTreeMap(){ const m={}; if(retailStore)retailStore.units.forEach(function(u){ if(u.audio)return; const k=u.Drift+'||'+(u.Garnet||''); const e=m[k]=m[k]||{}; if(e[u.account]===undefined)e[u.account]=chanParentOf(u.Drift,u.account,u.Garnet); }); return m; }
function chanCountries(){ const s={};
  if(store)store.units.forEach(function(u){ if(u.Drift&&!u.audio)s[u.Drift]=1; });
  if(retailStore)retailStore.units.forEach(function(u){ if(u.Drift&&!u.audio)s[u.Drift]=1; });
  return Object.keys(s).sort(); }
function chanLinesOf(Drift){ const s={};
  if(store)store.units.forEach(function(u){ if(u.Drift===Drift&&!u.audio&&u.Garnet)s[u.Garnet]=1; });
  if(retailStore)retailStore.units.forEach(function(u){ if(u.Drift===Drift&&!u.audio&&u.Garnet)s[u.Garnet]=1; });
  return Object.keys(s).sort(); }
function chanArchOf(Drift,Garnet){   // 该国(该产业)架构快照:直接渠道(FSD)与下游渠道(间接零售伙伴)+生效连线;Garnet 空=全部产业
  Garnet=Garnet||'';
  const direct={},ds={};
  const curOf=function(Dx,u){ const it=Dx&&Dx.byKey?Dx.byKey.get(u.key):null; return it?it.cur:F.unitCurrent(u,state.cfg); };
  const okL=function(u){ return !Garnet||u.Garnet===Garnet; };
  if(store)store.units.forEach(function(u){ if(u.Drift!==Drift||u.audio||!okL(u))return;
    let e=direct[u.account]; if(!e)e=direct[u.account]={account:u.account,raw:u.rawNames||[],units:0,so4:0,inv:0,inv1:0,products:{},lines:{}};
    e.units++; e.products[u.product]=1; if(u.Garnet)e.lines[u.Garnet]=1; const c=curOf(D,u); e.so4+=c.avgWeeklySO||0; e.inv+=c.curInv||0; e.inv1+=c.curInv1||0; });
  if(retailStore)retailStore.units.forEach(function(u){ if(u.Drift!==Drift||u.audio||!okL(u))return;
    let e=ds[u.account]; if(!e)e=ds[u.account]={account:u.account,raw:u.rawNames||[],units:0,so4:0,inv:0,products:{},lines:{}};
    e.units++; e.products[u.product]=1; if(u.Garnet)e.lines[u.Garnet]=1; const c=curOf(Dr,u); e.so4+=c.avgWeeklySO||0; e.inv+=c.curInv||0; });
  const dList=Object.keys(direct).sort().map(function(k){ const e=direct[k]; e.type=chanTypeEff(Drift,k,Garnet); e.typeSrc=chanTypeSrc(Drift,k,Garnet); e.explicit=e.typeSrc!=='guess'; e.children=[]; return e; });
  const sList=Object.keys(ds).sort().map(function(k){ const e=ds[k]; e.parent=chanParentOf(Drift,k,Garnet); e.parentSrc=chanParentSrc(Drift,k,Garnet);
    if(e.parent&&e.parent!=='*'){ if(direct[e.parent])direct[e.parent].children.push(k); else e.parentMissing=true; }
    e.isMirror=!!(e.parent&&e.parent!=='*'&&direct[e.parent]&&direct[e.parent].type!=='dist');   // 连到直达渠道 = 同一家(镜像)
    return e; });
  /* 数据识别(2026-09-02):直签渠道的总库存(Inventory)≈自有库存(INV1)——没有下游压货;分销型却 INV1≈总库存 且没连下游 → 疑似直签;标了直签却总库存≫INV1 → 疑似有下游 */
  dList.forEach(function(e){ e.sig=e.inv>0?e.inv1/e.inv:null; e.hint=null; e.hintKind=null;
    if(e.type==='dist'&&!e.children.length&&e.sig!=null&&e.sig>=0.95&&e.inv>=20){ e.hint='疑似直达消费者:总库存 '+F.fmt(e.inv)+' ≈ INV1 '+F.fmt(e.inv1)+',且没连下游'; e.hintKind='direct'; }
    else if(e.type!=='dist'&&!e.children.length&&e.sig!=null&&e.sig<0.8&&(e.inv-e.inv1)>=20){ e.hint='标为直达但总库存比 INV1 多 '+F.fmt(Math.round(e.inv-e.inv1))+' 台,疑似有下游压货'; e.hintKind='dist'; } });
  return {Drift:Drift,Garnet:Garnet,direct:dList,ds:sList};
}
function chanDetectDirect(Drift,Garnet){   // 一键采纳识别:类型是猜的、疑似直达的带下游型 → 设为 直达·零售(当前层)
  const a=chanArchOf(Drift,Garnet); let cnt=0;
  a.direct.forEach(function(d){ if(d.typeSrc==='guess'&&d.hintKind==='direct'){ chanSetType(Drift,Garnet,d.account,'retail'); cnt++; } });

/* ===== SO 目标:模板生成/带公式导出 ===== */
function genTplFromStores(){
  const th=dosThOf(null).red;
  const cand=[];
  const scan=function(Dx){
    if(!Dx)return;
    Dx.list.forEach(function(it){
      if(it.exempt||it.ignored)return;
      const u=it.u;
      if(chanTypeOf(u.account)==='eshop')return;
      const dosV=it.cur.dosCalc;
      const inf=(it.cur.curInv||0)>0&&dosV==null;
      if(!inf&&!(dosV!=null&&dosV>=th))return;
      cand.push(u);
    });
  };
  scan(Dr); scan(Da); scan(D);
  if(!cand.length){ alert('当前没有 DOS≥'+th+' 天(或 ∞)的渠道×产品。'); return; }
  const byKey={}; (targetRows||[]).forEach(function(tr){ byKey[tr.Drift+'|'+tr.channel+'|'+tr.product]=1; });
  let added=0;
  const out=(targetRows||[]).slice();
  cand.forEach(function(u){
    const k=u.Drift+'|'+u.account+'|'+u.product;
    if(byKey[k])return;
    byKey[k]=1; added++;
    out.push({Garnet:u.Garnet||'',product:u.product,Drift:u.Drift,channel:u.account,
      rawName:(u.rawNames&&u.rawNames.length)?u.rawNames.join('，'):u.account,
      t:{9:null,10:null,11:null,12:null},note:''});
  });
  if(!added){ alert('高库存 渠道×产品 均已在模板中,无新增。'); return; }
  if(!confirm('新增 '+added+' 行高库存 渠道×产品 到模板（已有 '+(targetRows?targetRows.length:0)+' 行及其目标保留），确认？'))return;
  targetRows=out; saveData4(); recompute();
}

/* ===== 预算底表:长表导出(SUMIFS 到预算表) =====
   粒度=单元×月;今年剩余段=看板同款推演数字(含手工改写);明年延伸段=平销引擎外推+补货规则续跑。
   FSD 源库存口径=渠道总库存单池(Δ库存=SI−SO,ST 为内部转移不改总量);下游/音频=零补货消化(拍数除外)。 */
let __budUnitCache=new Map(),__budUnitGen=-1;
function buildBudgetRows(endYear){
  if(__budUnitGen!==dataGen){ __budUnitCache=new Map(); __budUnitGen=dataGen; }
  const rows=[];
  const q4=function(m){ return 'Q'+Math.ceil(m/3); };
  const pushMonthRows=function(meta,wk){   // wk:[{p,so,si,inv}] 周序列→按月聚合
    const byM={};
    wk.forEach(function(r){
      const y=F.periodY(r.p), m=F.monthOfP(r.p);
      /* 周四归属:周属月的年取周四所在年(跨年周) */
      const th=new Date(F.mondayOf(F.periodY(r.p),F.periodW(r.p)).getTime()+3*86400000);
      const ym=th.getUTCFullYear()+'|'+m;
      let e=byM[ym]; if(!e)e=byM[ym]={y:th.getUTCFullYear(),m:m,so:0,si:0,endInv:0,lastP:0};
      e.so+=r.so||0; e.si+=r.si||0;
      if(r.p>e.lastP){ e.lastP=r.p; e.endInv=r.inv!=null?r.inv:e.endInv; }
    });
    const rrp=(state.rrp[meta.product]&&state.rrp[meta.product][meta.Drift]!=null)
      ?state.rrp[meta.product][meta.Drift]:null;
    Object.keys(byM).sort().forEach(function(ym){
      const e=byM[ym];
      rows.push([meta.Garnet,meta.product,state.budgetName[meta.product]||meta.product,
        meta.family||'',meta.Drift,meta.account,meta.src,
        e.y,q4(e.m),e.m,
        Math.round(e.so),Math.round(e.si),Math.round(e.endInv),
        rrp!=null?rrp:'',
        rrp!=null?Math.round(e.so*rrp):'',
        rrp!=null?Math.round(e.si*rrp):'',
        meta.note||'',
        meta.model!=null?String(meta.model):'']);   // 型号列(尾部追加,不动既有 SUMIFS 列位)
    });
  };
  /* 在售单元:三源 */
  [[D,store,'FSD'],[Dr,retailStore,'下游'],[Da,audioStore,'音频专表']].forEach(function(tri){
    const Dx=tri[0],stx=tri[1],srcName=tri[2];
    if(!Dx||!stx)return;
    const fwExt=F.futureWeeksTo(stx.maxPeriod,endYear);
    const fwNow=Dx.fw;
    const nowSet={}; fwNow.forEach(function(p){ nowSet[p]=1; });
    Dx.list.forEach(function(it){
      const u=it.u;
      if(it.ignored)return;
      const fam=F.familyOf(u.product);
      const lc=state.lifecycle[u.product]||null;
      const wk=[];
      /* 今年段:看板同款 */
      const simRows=it.sim&&it.sim.rows?it.sim.rows:[];
      let inv=null,lastSo=0;
      simRows.forEach(function(r){
        wk.push({p:r.p,so:r.so||0,si:(r.si!=null?r.si:(r.buy||0)),inv:r.inv});
        inv=r.inv; lastSo=r.so||0;
      });
      if(inv==null){ const stk=it.cur.curInv!=null?it.cur.curInv:it.cur.curInv1; inv=stk||0; }
      /* 延伸段:平销外推 + 轻量补货循环 */
      const bl=it.bl||{};
      const kd=(it.kl&&it.kl.kdef)||{};
      const g=(state.growth[u.key]!=null?state.growth[u.key]:gDefaultOf(u));
      const learned=learnOfCached(u);
      const params=learned||GarnetParamsOf(u.Garnet);
      const isFsd=srcName==='FSD';
      const rho=eolRhoOf(u);
      const rStep=state.cfg.roundTo||5;
      const glideX=state.glide||{};
      const capDefX={10:(glideX.m10!=null?glideX.m10:100),11:(glideX.m11!=null?glideX.m11:70),12:(glideX.m12!=null?glideX.m12:50)};
      const isIndX=isFsd&&(function(){ const cc=chanClassOf(u); return !!(cc&&cc.cls==='indirect'); })();
      const likeRetail=!isFsd||isIndX;                        // 间接渠道与下游同款(2026-09-01 拍板)
      const polR=likeRetail?(policyOfCached(u)||params):null;   // 渠道策略>学习DOS>线默认
      const yepR=likeRetail?yearEndProfileChain(stx,u):null;     // 全年按历史月末画像
      const siCap=siCapOf(u);                                // 单周进货能力上限(三源同用)
      const nlX=F.normalLevelOf(u,bl);                        // 正常经营水位(平销库存/平销DOS)
      const carryX=(it.fc&&it.fc.carryEnd)||1;                // 今年最后一次拍数的承接比例接力到延伸段
      const win=[];
      simRows.slice(-4).forEach(function(r){ win.push(r.so||0); });
      let anchor=lastSo;
      /* 单元级增量缓存:拍数只改少数单元,其余单元的延伸段直接复用上次结果(签名=推演结果+全部影响延伸段的参数) */
      const metaX={Garnet:u.Garnet||'',product:u.product,family:fam?fam.family:'',
        Drift:u.Drift,account:u.account,src:srcName,model:u.model,
        note:(it.cls&&it.cls.status==='stock')?'纯库存管控':(bl.conf==='low'||bl.base==null?'平销低置信·延伸段用近4周均':'')};
      let sSo=0,sSi=0; simRows.forEach(function(r){ sSo+=r.so||0; sSi+=(r.si!=null?r.si:(r.buy||0)); });
      const sig=[simRows.length,sSo,sSi,inv,lastSo,bl.base,bl.delta,bl.conf,g,lc?lc.eolSI+'/'+lc.eolSO:'',
        polR?JSON.stringify(polR):'',yepR?(yepR.src+'/'+yepR.medDos+'/'+JSON.stringify(yepR.m)):'',siCap,
        glideX.m10,glideX.m11,glideX.m12,rStep,state.buyMode[u.key]||'',carryX,nlX?nlX.inv+'/'+nlX.dos:'',buyAutoOf(u)].join('|');
      const ck=srcName+'|'+u.key+'|'+endYear;
      const hit=__budUnitCache.get(ck);
      if(hit&&hit.sig===sig){ pushMonthRows(metaX,hit.wk); return; }
      /* 第一遍:按公式排出延伸段计划SO(不受库存约束),供第二遍取"接下来要卖多少"——补货看前瞻需求,不看被大促放大的近4周 */
      const planSO=[],planIdx={};
      (function(){
        const win1=win.slice(); let anchor1=anchor;
        fwExt.forEach(function(p,i){
          if(p<=fwNow[fwNow.length-1])return;
          const w=F.periodW(p); const k=kd[w]!=null?kd[w]:1; let so1;
          if(lc&&lc.eolSI&&p>lc.eolSI){ anchor1=anchor1*rho; so1=Math.max(0,anchor1); }
          else if(bl.base!=null&&bl.conf!=='low'){ so1=Math.max(0,bl.base*Math.pow(1+(bl.delta||0),i)*k*g*carryX); }   // 承接今年拍数比例
          else { let s1=0; win1.forEach(function(v){s1+=v;}); const avg1=win1.length?s1/win1.length:0; so1=Math.max(0,avg1*k*g); }
          if(lc&&lc.eolSO&&p>lc.eolSO)so1=0;
          planIdx[p]=planSO.length; planSO.push(so1);
          win1.push(so1); while(win1.length>4)win1.shift();
          if(!(lc&&lc.eolSI&&p>lc.eolSI))anchor1=so1||anchor1;
        });
      })();
      (function(){ const q=F.quantizeSeq(planSO,rStep); for(let q4=0;q4<planSO.length;q4++)planSO[q4]=q[q4]; })();   // 累计取整:5 台倍数且总量不丢
      const fwdAt=function(j){ let s=0,c=0; for(let q3=j;q3<planSO.length&&c<8;q3++){ s+=planSO[q3]; c++; } return c?s/c/7:0; };
      fwExt.forEach(function(p,i){
        if(p<=fwNow[fwNow.length-1])return;   // 已含在今年段
        let so=planSO[planIdx[p]];   // 第二遍:计划SO 来自第一遍
        const jP=planIdx[p];
        const dFwdE=fwdAt(jP);       // 前瞻需求(本周起 8 周计划SO日均)
        const dNx=dFwdE>0?dFwdE:((bl.base!=null&&bl.base>0)?bl.base/7:0);
        let si=0;
        const noAuto=(function(){ const cc=chanClassOf(u); return !!(cc&&cc.cls==='indirect'); })();
        if(isFsd&&!isIndX&&!(lc&&lc.eolSI&&p>lc.eolSI)){
          let s=0; win.forEach(function(v){s+=v;});
          const dailyW=win.length?s/win.length/7:0;
          const daily=dFwdE>0?dFwdE:((bl.base!=null&&bl.base>0&&bl.conf!=='low')?bl.base/7:dailyW);   // 前瞻需求优先(接下来要卖多少),再平销,再滚动均值
          const dos=daily>0?(inv-so)/daily:null;
          if(daily>0&&dos!=null&&dos<params.trigger){
            si=Math.max(0,F.round5(params.target*daily-(inv-so),rStep)||0);
            /* 延伸年年末收官:10/11/12 月底按默认梯度粗约束 */
            const m=F.monthOfP(p);
            const capD=capDefX[m];
            if(capD!=null&&daily>0){
              const capInv=capD*daily+so-inv;
              if(capInv<si)si=Math.max(0,F.round5(Math.max(0,capInv),rStep)||0);
            }
          }
        } else if(likeRetail&&buyAutoOf(u)&&!(lc&&lc.eolSI&&p>lc.eolSI)){
          /* 下游/音频延伸段:与今年段同款,按渠道学习策略补货(水位型/DOS门槛型;2026-09-01 拍板,原为零补货) */
          const pre2=inv-so;
          let sR=0; win.forEach(function(v){sR+=v;});
          const dailyR=win.length?sR/win.length/7:0;
          const dRule=dFwdE>0?dFwdE:((bl.base!=null&&bl.base>0&&bl.conf!=='low')?bl.base/7:dailyR);   // 前瞻需求优先(接下来要卖多少),再平销,再滚动均值
          if(polR.type==='inv'){
            if(dRule>0&&pre2<=polR.triggerInv){
              let tgt=polR.targetInv;
              if(polR.targetDos!=null)tgt=Math.min(tgt,polR.targetDos*dRule*1.5);
              si=Math.max(0,F.round5(tgt-pre2,rStep)||0);
            }
          } else {
            if(dRule>0&&(pre2/dRule)<polR.trigger)si=Math.max(0,F.round5(polR.target*dRule-pre2,rStep)||0);
          }
          /* 延伸年全年:按历史月末画像"月末补到位"——高于画像不进,低于画像按到月末剩余周数均摊补上 */
          const mY=F.monthOfP(p);
          const eY=(yepR&&yepR.m[mY])?yepR.m[mY]:null;
          if(eY&&dRule>0){
            const pe=F.monthEndPeriodOf(F.periodY(p),mY);
            const dMe0=planIdx[pe]!=null?fwdAt(planIdx[pe]+1):0;
            const dMe=dMe0>0?dMe0:dRule;   // 月末水平按月末之后的前瞻需求折算
            let level=null;
            const dosC=(nlX&&nlX.dos>0&&eY.dos!=null)?Math.max(nlX.dos*0.6,Math.min(nlX.dos*1.5,eY.dos)):eY.dos;   // 画像按平销水位夹紧
            if(polR.type==='inv'&&yepR.src==='unit'&&eY.inv!=null){
              level=nlX?Math.min(eY.inv,nlX.inv*1.5):eY.inv; if(dosC!=null)level=Math.min(level,dosC*dMe*1.5);
            } else if(dosC!=null)level=dosC*dMe;
            if(level!=null){ const ceil=nlX&&nlX.dos>0?nlX.dos*1.5*dMe:((yepR.medDos!=null&&yepR.medDos>0)?yepR.medDos*1.6*dMe:null); if(ceil!=null&&level>ceil)level=ceil; }
            if(level!=null&&nlX&&level>nlX.inv*1.5)level=nlX.inv*1.5;
            if(level!=null){
              const remain=Math.max(1,F.weekIndex(pe)-F.weekIndex(p)+1);
              const allow=level+so*remain-inv;
              if(si>allow)si=Math.max(0,F.round5(Math.max(0,allow),rStep)||0);
              const short=allow-si;
              if(short>0)si+=Math.max(0,F.round5(short/remain,rStep)||0);
            }

        }
        if(nlX&&si>0&&dNx>0){   // 正常经营水位:进货后库存不超 min(平销库存×1.5, 平销DOS×1.5×需求),至少留 30 天需求
          const ceilN=Math.max(Math.min(nlX.inv*1.5,nlX.dos*1.5*dNx),dNx*30);
          const room=ceilN-(inv-so); if(si>room)si=Math.max(0,F.round5(Math.max(0,room),rStep)||0);
        }
        if(siCap!=null&&si>siCap)si=Math.max(0,F.round5(siCap,rStep)||0);   // 渠道从没吃过的量,客户也不会有预算
        so=Math.min(so,inv+si);   // 库存硬约束(下游/音频恒生效;FSD 单池口径同样成立)
        inv=inv+si-so;
        win.push(so); while(win.length>4)win.shift();
        if(!(lc&&lc.eolSI&&p>lc.eolSI))anchor=so||anchor;
        wk.push({p:p,so:so,si:si,inv:inv});
      });
      __budUnitCache.set(ck,{sig:sig,wk:wk});
      pushMonthRows(metaX,wk);
    });
  });
  /* 锁量贯通到延伸段(2026-09-02 用户:锁量后未来不可能还在持续 SI/Purchase,总量必须对齐):
     每个锁量型号:延伸段自动 SI 总量 ≤ 余量 − 今年段已排(看板同款,含手拍);FSD+音频共用一份余量(权威源),下游按余量单独封顶。
     超出按比例压缩并逐单元重链月末库存——pv 明年列/财经Q表/底表用的是同一份行 */
  if(__lockRes&&Object.keys(__lockRes).length){
    const stxB=retailStore||store||audioStore;
    const curYB=stxB?F.periodY(stxB.maxPeriod):0;
    const rStepB=state.cfg.roundTo||5;
    Object.keys(__lockRes).forEach(function(mk){
      const R=__lockRes[mk]; if(!R||!(R.total>0))return;
      const ix=mk.indexOf('||'); const prod=mk.slice(0,ix),model=mk.slice(ix+2);
      const prodN=mkNorm(prod),modelN=mkNorm(model);
      let curFA=0,curR=0; const extFA=[],extR=[];
      rows.forEach(function(r,i){
        if(mkNorm(r[1])!==prodN||mkNorm(r[17])!==modelN||r[6]==='新品规划')return;
        const isR=r[6]==='下游';
        if(+r[7]<=curYB){ if(isR)curR+=(+r[11]||0); else curFA+=(+r[11]||0); }
        else (isR?extR:extFA).push(i);
      });
      R.extF=F.squeezeMonthRows(rows,extFA,Math.max(0,R.remain-curFA),rStepB,'锁量压缩(延伸段)');
      R.extRetailF=F.squeezeMonthRows(rows,extR,Math.max(0,(R.retailBudget!=null?R.retailBudget:((state.cfg.lockRetailInv1===true?inv1OfMk(mk).sum:0)+R.remain))-curR),rStepB,'锁量压缩(延伸段·下游)');   // 下游预算=min(余量[+INV1], 锁量总量−下游累计Purchase)−今年已排
    });
    /* 产品级兜底(延伸段):型号对不上的下游行按该产品锁量预算合计(减去今年全部下游行与延伸段已匹配行)约束 */
    const byProdE={};
    Object.keys(__lockRes).forEach(function(mk){ const R=__lockRes[mk]; if(!R||!(R.total>0))return; const ix=mk.indexOf('||'); const pn=mkNorm(mk.slice(0,ix)); const g=(byProdE[pn]=byProdE[pn]||{mks:[],models:{}}); g.mks.push(mk); g.models[mkNorm(mk.slice(ix+2))]=1; });
    Object.keys(byProdE).forEach(function(pn){ const g=byProdE[pn];
      let budget=0; g.mks.forEach(function(mk){ budget+=(__lockRes[mk].retailBudget||0); });
      let used=0; const unIdx=[];
      rows.forEach(function(r,i){ if(r[6]!=='下游'||mkNorm(r[1])!==pn)return;
        const matched=!!g.models[mkNorm(r[17])];
        if(matched||+r[7]<=curYB)used+=(+r[11]||0); else unIdx.push(i); });
      if(!unIdx.length)return;
      const f=F.squeezeMonthRows(rows,unIdx,Math.max(0,budget-used),rStepB,'锁量压缩(延伸段·下游·按产品兜底)');
      g.mks.forEach(function(mk){ __lockRes[mk].extUnmatchedF=f; });
    });
  }
  /* 新品规划:直接用新品引擎的长窗口结果 rowsLong(与新品页/看板同一份参数;此前这里用固定 60/90、增速 1 重跑,跨年会断口) */
  if(state.newProducts.length&&Dn){
    const lastPB=F.mkPeriod(endYear,F.weeksInISOYear(endYear));
    Dn.perNp.forEach(function(pn){
      const np=pn.np;
      pn.units.forEach(function(vu){
        const rowsL=(vu.rowsLong||vu.rows).filter(function(r){ return r.p<=lastPB; });
        pushMonthRows({Garnet:np.Garnet||'',product:np.name,family:np.family||'',
          Drift:vu.Drift,account:vu.account,src:'新品规划',model:np.name,note:'规划数据(虚拟)'},   // 型号位=产品名(与 npDx 一致)
          rowsL.map(function(r){ return {p:r.p,so:r.so,si:r.si,inv:r.inv}; }));
      });
    });
  }
  return rows;
}
const BUDGET_HEADERS=['产品线BU','产品(软件名)','预算名(传播名)','产品系族','国家','渠道','数据源',

    ['4. 口径：'+curY+' 年剩余月份 = 软件看板同款推演（含你的手工改写与拍数）；'+(endYear>curY?(endYear+' 年 = 平销引擎外推（平销×漂移×周季节×大盘增速）+ 补货规则续跑（FSD 源,含 10/11/12 月底收官粗约束）；低置信单元延伸段用近4周均,备注列有标注。'):'')],
    ['5. FSD 源库存为渠道总库存单池口径（库存变化 = SI − SO,ST 为内部转移）；下游/音频为零补货消化口径（分月模拟拍数除外）。'],
    ['6. SO金额/SI金额 = 量 × RRP(本币),仅作参考——正式收入请沿用预算表 NSIP 公式链(RRP→去税→去渠长→负向投入→汇率)。'],

    ['8. 建议在预算表中用 数据-刷新 前先整表替换本底表 sheet,保持列位不变。']
  ];
  const qv=F.budgetQuarterPivot(rows,endYear);
  guide.push(['9. 「财经Q表」sheet = 直接按你的经营数据表输入块透视好的结果(BU×传播名×国家 → '+(endYear-1)+'年年底库存/SO Q1-Q4/SI Q1-Q4/年底库存/年底DOS/RRP,千台一位小数,权威口径剔下游明细与FSD源音频行,含新品规划;年底DOS=年底库存÷(12月SO÷12月天数=周数×7))——可整块粘贴或 VLOOKUP;要自己 SUMIFS 就用「底表」的 H 列(年)+I 列(季度 Q1-Q4)。']);
  if(SHELL&&SHELL.saveXlsx){
    const res=await SHELL.saveXlsx({name:'预算底表-'+endYear+'.xlsx',
      sheets:[{name:'财经Q表',rows:[qv.headers].concat(qv.rows)},{name:'底表',rows:[BUDGET_HEADERS].concat(rows)},{name:'使用说明',rows:guide}]});
    if(res&&res.ok)alert('预算底表已导出（财经Q表 '+qv.rows.length+' 行 + 底表 '+rows.length+' 行 + 使用说明）：'+res.path);
    else if(res&&!res.canceled)alert('导出失败: '+(res.error||''));
  } else {
    exportTableRaw('预算底表-'+endYear,BUDGET_HEADERS,rows);
  }
}

/* ===== 新品规划:软件内添加未上市产品,按锚品×档位×上市时点×渠道起量基线生成 SI/SO ===== */
function renderNewProd(){
  const el=$('#view-newprod');
  const prods=[];
  [store,retailStore,audioStore].forEach(function(stx){
    if(stx)stx.units.forEach(function(u){ if(u.product&&prods.indexOf(u.product)<0)prods.push(u.product); });
  });
  prods.sort();
  const fams={};
  Object.keys(F.PRODUCT_MAP).forEach(function(p2){ const e=F.PRODUCT_MAP[p2]; fams[e.family]=e.Garnet; });
  const lines=[]; Object.keys(fams).forEach(function(f2){ if(lines.indexOf(fams[f2])<0)lines.push(fams[f2]); });
  lines.sort();
  const f=state.ui.npForm||(state.ui.npForm={});
  /* 产品→产品线 映射,供锚品/承接下拉按产品线过滤 */
  const prodLine={};
  [store,retailStore,audioStore].forEach(function(stx){ if(stx)stx.units.forEach(function(u){ if(u.product&&!prodLine[u.product])prodLine[u.product]=u.Garnet; }); });
  /* 默认产品线=第一个有在售产品的产品线(锚品下拉才有货);上市周默认=三源最新周的下一周 */
  const linesWithProds=lines.filter(function(l){ return prods.some(function(p2){ return prodLine[p2]===l; }); });
  const GarnetSel=f.Garnet||linesWithProds[0]||lines[0]||'';
  const famsOfLine=Object.keys(fams).filter(function(fm){ return fams[fm]===GarnetSel; }).sort();
  const famList=famsOfLine.length?famsOfLine:Object.keys(fams).sort();
  const prodsOfLine=prods.filter(function(p2){ return prodLine[p2]===GarnetSel; });
  const anchorList=prodsOfLine.length?prodsOfLine:prods;
  /* 覆盖范围到国家(2026-09-01 用户拍板):多选在哪几个国家上,默认勾锚品在售的国家;国家内自动铺渠道 */
  const anchorSel=f.anchor||anchorList[0]||'';
  const allCountries=[]; const anchorCountries={};
  [store,retailStore,audioStore].forEach(function(stx){ if(!stx)return; stx.units.forEach(function(u){
    if(u.Drift&&allCountries.indexOf(u.Drift)<0)allCountries.push(u.Drift);

  const maxP=Math.max.apply(null,[store,retailStore,audioStore].filter(Boolean).map(function(s2){ return s2.maxPeriod||0; }));

  let h='<div class="panel"><h3>'+(editing?'编辑新品':'添加新品')+'</h3>'
    +'<div class="note">新品是<b>规划数据</b>(不在底表里的未上市产品):添加后会在<b>推演编辑的「新品」源看板</b>里出现——按你选的覆盖范围,每个国家×渠道都有这个新品的 SI/SO/库存/DOS 四行,可以直接拍数;也进预算底表与推演汇总(勾选叠加)。'

    +'<b>承接老品</b>=可选,老品已设末次SI周时,它各渠道平销的 70% 转给新品。上市周落在大促周时首销脉冲 1.8 倍、首批铺货 SI ×1.3。</div>'

  if(!state.newProducts.length){
    h+='<div class="panel note">尚无新品规划。选一个同档位历史锚品、填上市周即可生成分渠道 SI/SO 模拟与产品整体叠加曲线。</div>';

    const ai=pn.anchorInfo||null; const fwL=(Dn&&Dn.fwLong)||Dn.fw;
    h+='<div class="panel"><h3>'+esc(np.name)+' <span class="chip anchor">新品规划</span>'
      +(pn.live

          ?(Math.abs(pn.liveDev)>0.3
            ?' <span class="chip pend" title="上市后前4周:实际 vs 规划偏差超过 30%,请重新校准锚定品或缩放系数">复盘:偏差 '+(pn.liveDev>0?'+':'')+Math.round(pn.liveDev*100)+'%·请重校准</span>'
            :' <span class="chip auto" title="上市后前4周:实际与规划基本吻合">复盘:偏差 '+(pn.liveDev>0?'+':'')+Math.round(pn.liveDev*100)+'%·吻合</span>')
          :' <span class="chip pend" title="底表已出现同名产品且上市满4周:请用实际数据校准,或删除本规划改用真实推演">已上市·请复盘校准</span>')

      +' · 覆盖渠道 '+pn.units.length+'/'+pn.nCh

      +(!pn.units.length?'<div class="note" style="color:var(--warn)">没有铺出任何渠道:锚品「'+esc(np.anchor)+'」在所选国家没有历史销量,基准取不到——换一个卖过的锚品,或改上市国家。</div>':'')

    }

      +'<th class="l" title="该渠道首次铺货周,可点击改写(发货时间不同;格式 26W40,清空恢复统一上市周)">首SI周(可改)</th>'
      +'<th title="起量周数与来源">起量</th>'
      +'<th title="首批铺货 SI(目标DOS×日均,大促上市×1.3)">首批SI</th>'
      +'<th title="上市周是否处于该国/该渠道大促">大促上市</th>'
      +'<th title="推演窗口内合计(到 '+wkLab(fwL[fwL.length-1])+')">期内SO</th><th title="推演窗口末周库存">期末库存</th></tr></thead><tbody>';
    pn.units.forEach(function(vu){

      const endInv=rowsL.length?rowsL[rowsL.length-1].inv:0;
      const ovCh=!!(np.chFirst&&np.chFirst[vu.ck]);
      h+='<tr><td class="l">'+esc(vu.Drift)+'</td>'
        +'<td class="l ell" title="'+esc(vu.account)+'">'+esc(vu.account)+'</td>'

        +'<td class="l ov" contenteditable data-npch="'+esc(vu.ck)+'" data-npi="'+pi+'">'

  el.querySelectorAll('button[data-npexp]').forEach(function(b){

      state.newProducts.splice(i,1); recompute();
    };
  });
  el.querySelectorAll('button[data-npreplay]').forEach(function(b){
    b.onclick=function(){
      const pn=Dn&&Dn.perNp[+b.dataset.npreplay]; if(!pn)return;
      /* 锚品重放:各渠道锚品首12有效周实际 vs 模型形状(base=锚品自身平销,ramp=学习值) */
      let sumAbs=0,sumAct=0,nCh=0;
      [[Dr],[Da],[D]].forEach(function(pair){
        const Dx=pair[0]; if(!Dx)return;
        Dx.list.forEach(function(it){
          if(it.u.product!==pn.np.anchor)return;
          const u=it.u;
          const okSo=function(so){ return u.audio?(so!=null&&so>0):(so!=null); };
          const validP=u.periods.filter(function(p){ return okSo(u.weeks.get(p).so); });
          if(validP.length<16)return;
          const hh=F.anchorHistOf(u,{});
          const base=(hh&&hh.base>0)?((hh.active&&it.bl&&it.bl.base>0)?it.bl.base:hh.base):null;   // 退市老品也能重放
          if(!base)return;
          const rampW=F.rampOf(u,base,state.cfg)||2;
          nCh++;
          for(let i=0;i<12&&i<validP.length;i++){
            const act=u.weeks.get(validP[i]).so;
            let pred;
            if(i<rampW)pred=base*((i+1)/rampW)*(i<4?1.4:1);
            else pred=base;
            sumAbs+=Math.abs(pred-act); sumAct+=act;
          }

const SM_DIMS={Garnet:['产品线'],Drift:['国家'],product:['产品'],
  cp:['国家','产品'],ca:['国家','渠道'],cap:['国家','渠道','产品']};
function smAgg(){ return {n:0,inv:0,daily:0,futSO:0,futSI:0,mo:{},moSI:{},me:{},endInv:0}; }
function smAdd(a,it,mes,fwMonthOf){
  a.n++;
  if(it.cur.curInv!=null)a.inv+=it.cur.curInv;
  if(it.cur.dailySO)a.daily+=it.cur.dailySO;
  const rows=it.sim?it.sim.rows:[];
  rows.forEach(function(r){
    a.futSO+=r.so;
    const si=(r.si!=null?r.si:(r.buy||0));   // FSD=SI 要货;下游/音频=Purchase 模拟
    a.futSI+=si;
    const m=fwMonthOf[r.p];
    if(m!=null){ a.mo[m]=(a.mo[m]||0)+r.so; a.moSI[m]=(a.moSI[m]||0)+si; }
  });
  if(rows.length)a.endInv+=rows[rows.length-1].inv;
  mes.forEach(function(me){
    for(let i=0;i<rows.length;i++){ if(rows[i].p===me.p){
      let e=a.me[me.p]; if(!e)e=a.me[me.p]={inv:0,daily:0,so:0,days:F.monthDaysOf(F.periodY(me.p),me.m)};
      e.inv+=rows[i].inv; e.daily+=(rows[i].daily||0);
      e.so+=F.unitMonthSO(it.u,rows,F.periodY(me.p),me.m);   // 该月SO=已发生周实际+未发生周推演(月末DOS 分母,2026-09-02 统一)
      break; } }
  });
}

    const m=F.monthOfP(p);

/* FSD 渠道类别别名:以 rawAccount 起算幂等重放(与下游 channelAlias 同思路) */
function applyChanAlias(rows){
  return rows.map(function(r){
    const raw=r.rawAccount||r.account;
    const cc=state.chanClass[raw];
    if(cc&&cc.alias&&cc.alias!==raw)
      return Object.assign({},r,{rawAccount:raw,account:cc.alias});
    if(r.rawAccount)return r;
    return Object.assign({},r,{rawAccount:raw});
  });
}
/* 渠道改名后迁移手工设置键(键=国家::账户::型号,账户在中段) */
function migrateAccountKeys(oldA,newA){
  const mig=function(bag){ if(!bag)return;
    Object.keys(bag).forEach(function(k){
      const parts=k.split(F.SEP);
      if(parts.length===3&&parts[1]===oldA){
        const nk=parts[0]+F.SEP+newA+F.SEP+parts[2];
        if(bag[nk]==null)bag[nk]=bag[k];
        delete bag[k];
      }
    });
  };
  mig(state.ovSO);mig(state.ovSI);mig(state.decisions);mig(state.growth);mig(state.ignored);mig(state.watchBase);
  mig(state.watch.fsd);mig(state.watch.retail);mig(state.watch.audio);
  mig(state.riskSel.fsd);mig(state.riskSel.retail);mig(state.riskSel.audio);
  migrateNameExtras(oldA,newA);
}
/* 渠道名嵌在非单元键里的迁移:层实例系数微调(A|渠道|产品线)、渠道属性、电渠遗留、汇总监控节点键。
   FSD 类别改名与下游渠道改名两条通道共用。 */
function migrateNameExtras(oldA,newA){
  Object.keys(state.kedit||{}).forEach(function(k){
    if(k.indexOf('A|'+oldA+'|')===0){
      const nk='A|'+newA+k.slice(2+oldA.length);
      if(state.kedit[nk]==null)state.kedit[nk]=state.kedit[k];
      delete state.kedit[k];
    }
  });
  if(state.chanProp&&state.chanProp[oldA]&&!state.chanProp[newA]){
    state.chanProp[newA]=state.chanProp[oldA]; delete state.chanProp[oldA]; }
  const migNk=function(bag,baseBag,basePrefix){
    Object.keys(bag||{}).forEach(function(nk){
      const parts=nk.split('|#|');
      if(parts.length<5||parts[4]!==oldA)return;   // 渠道名只在第 5 段(数据源|线|产品|国家|渠道)
      parts[4]=newA;
      const nn=parts.join('|#|');
      if(bag[nn]==null)bag[nn]=bag[nk];
      delete bag[nk];
      if(baseBag){
        const ob=baseBag[basePrefix+nk];
        if(ob!=null&&baseBag[basePrefix+nn]==null)baseBag[basePrefix+nn]=ob;
        delete baseBag[basePrefix+nk];
      }
    });
  };
  migNk(state.watch.sum,state.watchBase,'sum|');
  migNk(state.riskSel.sum,null,'');
}

  if(!state.promoCal)state.promoCal={};
  if(state.useBaseline==null)state.useBaseline=false;
  if(state.cfg.blHead==null)state.cfg.blHead=8;
  if(state.cfg.blKappa==null)state.cfg.blKappa=1.25;
  if(state.folder4==null)state.folder4='';
  if(!state.dosRed)state.dosRed={def:{red:200,amber:150},
    m:{9:{red:200,amber:150},10:{red:100,amber:85},11:{red:70,amber:60},12:{red:50,amber:45}}};
  /* 2026-08-26 用户拍板:9月底红线 200;仅当存档仍为旧默认(150/120)时升级,手改过的值不动 */
  if(state.dosRed.m&&state.dosRed.m[9]&&state.dosRed.m[9].red===150&&state.dosRed.m[9].amber===120)
    state.dosRed.m[9]={red:200,amber:150};
  /* 旧存档单选(字符串)→多选(数组) */
  ['Drift','acct','Garnet','rcC','rcCh','rcL','meLine','smLine','auC','auA','fCls','tgRep','tgC','tgL'].forEach(function(k){
    const v=state.ui[k];
    if(typeof v==='string')state.ui[k]=v?[v]:[];
    if(!Array.isArray(state.ui[k]))state.ui[k]=[];
  });
  state.ui.tab='overview';
  if(SHELL&&SHELL.onProgress){ SHELL.onProgress(function(d){
    const el=document.getElementById('folderStatus-'+activeScanKind);
    if(el)el.textContent='解析中 '+d.i+'/'+d.n+'：'+d.file;
    const dl=document.getElementById('dataline'); if(dl)dl.textContent='解析文件 '+d.i+'/'+d.n+'…';
    if(scanProg&&d.n>0){
      /* 文件解析占区段前 88%,合并重算占后 12%(与 scanFolderKind 的 0.88 对应) */
      progShow(scanProg.base+((d.i-1)/d.n)*scanProg.span*0.88,
        scanProg.label+'：解析 '+d.file+'（'+d.i+'/'+d.n+'，'+Math.round(d.i/d.n*100)+'%）');
    }
  }); }
  if(state.ui.zoom&&state.ui.zoom!==1)applyZoom(state.ui.zoom,true);
  progShow(20,'读取本机数据缓存…'); await progTick();
  let data=null,data2=null,data3=null,data4=null;
  if(SHELL&&SHELL.dataLoad){
    try{ const rd=await SHELL.dataLoad();
      if(rd&&rd.ok){ data=rd.fsd||null; data2=rd.retail||null; data3=rd.audio||null; data4=rd.target||null; } }catch(e){}
  }
  if(data==null){ try{ data=localStorage.getItem(LS_DATA); }catch(e){} }
  if(data2==null){ try{ data2=localStorage.getItem(LS_DATA2); }catch(e){} }
  if(data3==null){ try{ data3=localStorage.getItem(LS_DATA3); }catch(e){} }
  saveState();   // 迁移/升级后立即把方案落盘成文件
  let progDeferred=false;   // 自动扫描分支在异步闭包里收遮罩,boot 主线不收
  if(SHELL&&state.autoScan&&(state.folder||state.folder2||state.folder3)){
    progDeferred=true;
    render();
    (async function(){
      const kinds=[];
      if(state.folder)kinds.push('fsd');
      if(state.folder2)kinds.push('retail');
      if(state.folder3)kinds.push('audio');
      if(state.folder4)kinds.push('target');
      const span=72/kinds.length;
      let ok1=false;
      try{
        for(let i=0;i<kinds.length;i++){
          scanProg={base:24+i*span,span:span,label:SCAN_LABELS[kinds[i]]};
          const ok=await scanFolderKind(kinds[i]);
          if(kinds[i]==='fsd')ok1=ok;
          scanProg=null;
        }
        progShow(97,'恢复本机缓存数据…'); await progTick();
        if(!ok1&&!store){
          if(data)importText(data,'本机已保存数据');
          else importText(F.genSampleTSV(),'内置示例数据（FSD 文件夹未配置或扫描失败）');
        }
        if(!retailStore&&data2) importRetailText(data2,'本机已保存下游数据');
        if(!audioStore&&data3) importAudioText(data3,'本机已保存音频专表数据');
        if(!targetRows&&data4) importTargetText(data4,'本机已保存 SO 目标数据');
        progShow(99,'渲染看板…'); await progTick();
        render();
      } finally { progHide(); }
    })();
  }
  else if(data||data2||data3||data4){
    progShow(45,'解析本机已保存数据…'); await progTick();
    if(data)importText(data,'本机已保存数据');
    if(data2)importRetailText(data2,'本机已保存下游数据');
    if(data3)importAudioText(data3,'本机已保存音频专表数据');
    if(data4)importTargetText(data4,'本机已保存 SO 目标数据');
  }
  else {
    progShow(60,'载入内置示例数据…'); await progTick();
    importText(F.genSampleTSV(),'内置示例数据（首次打开自动载入）');
    importRetailText(F.genRetailSampleTSV(),'内置下游示例数据');
    importAudioText(F.genAudioSampleTSV(),'内置音频专表示例数据');
  }
  if(!progDeferred){ progShow(94,'渲染看板…'); await progTick(); }
  render();
  if(!progDeferred)progHide();
  if(bootDoneResolve)bootDoneResolve();
  /* 空闲预热:数据就绪后用空闲时间预建 明年+后年 外推基表(budTo),首次打开多年视图/AI 明年问答零等待 */
  const idle=window.requestIdleCallback||function(fn){ return setTimeout(fn,800); };
  idle(function(){
    try{
      if(store&&store.units.size){
        const cy=F.periodY(store.maxPeriod);
        budgetRowsOv(cy+2);
      }
    }catch(e){}
  });
}
boot().catch(function(e){
  /* 启动任何异常都必须收掉遮罩,否则表现为整软件假死 */
  try{ progHide(); }catch(e2){}
  const dl=document.getElementById('dataline');
  if(dl)dl.textContent='启动异常：'+String(e&&e.message||e);
});
})();
</script>
</body>
</html>
